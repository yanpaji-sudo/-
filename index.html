
               
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印 - 照片/视频水印工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; font-weight: 600; color: #FFD700; }
        .header .brand { font-size: 12px; color: rgba(255,255,255,0.3); }

        /* 上传区域 */
        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .upload-btn {
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-btn:hover { background: rgba(255,255,255,0.1); border-color: #4CAF50; }
        .upload-btn .icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .upload-btn .label { font-size: 13px; color: rgba(255,255,255,0.6); }

        /* 预览区域 */
        .preview-section {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-section img, .preview-section video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }
        .preview-section .placeholder {
            color: rgba(255,255,255,0.2);
            font-size: 14px;
            padding: 40px;
            text-align: center;
        }

        /* 水印样式选择 */
        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .style-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 0;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .style-btn.active { background: #4CAF50; border-color: #4CAF50; color: #fff; }

        /* 编辑区域 */
        .edit-area {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .edit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .edit-row label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            min-width: 50px;
            display: flex;
            align-items: center;
        }
        .edit-row input, .edit-row select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            min-width: 120px;
        }
        .edit-row input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .edit-row .hint { font-size: 11px; color: rgba(255,255,255,0.2); }

        /* 位置联想下拉 */
        .suggestions {
            background: #2a2a2a;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: -8px;
            margin-bottom: 8px;
            display: none;
        }
        .suggestions.active { display: block; }
        .suggestions .item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .suggestions .item:hover { background: rgba(255,255,255,0.05); }
        .suggestions .item .addr { font-size: 11px; color: rgba(255,255,255,0.3); }

        /* 防伪标志设置 */
        .anti-counterfeit {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,215,0,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.1);
            margin-bottom: 16px;
        }
        .anti-counterfeit label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .anti-counterfeit input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FFD700;
        }

        /* 导出按钮 */
        .export-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .export-btn:hover { transform: scale(1.01); opacity: 0.9; }
        .export-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* 下载区域 */
        .download-section {
            margin-top: 16px;
            display: none;
        }
        .download-section.active { display: block; }
        .download-section .result {
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
        }
        .download-section .result img, .download-section .result video {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .download-section .download-link {
            display: block;
            margin-top: 12px;
            padding: 12px;
            text-align: center;
            background: #2196F3;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }
        .download-section .download-link:hover { background: #1976D2; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* 水印预览叠加层 - 实时显示 */
        .watermark-preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* 水印样式1 - 经典版（与今日水印一致） */
        .wp-classic {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-classic .slogan { font-size: 20px; font-weight: bold; color: #FFD700; font-family: 'STKaiti', serif; margin-bottom: 2px; }
        .wp-classic .datetime { font-size: 14px; color: #fff; opacity: 0.9; }
        .wp-classic .weather { font-size: 13px; color: #fff; opacity: 0.8; }
        .wp-classic .location { font-size: 13px; color: #fff; opacity: 0.9; margin-top: 2px; }

        /* 水印样式2 - 简洁版 */
        .wp-simple {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-simple .top { display: flex; justify-content: space-between; align-items: flex-end; }
        .wp-simple .date { font-size: 26px; font-weight: 300; color: #fff; }
        .wp-simple .time { font-size: 26px; font-weight: 300; color: #fff; }
        .wp-simple .info { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 2px; }

        /* 水印样式3 - 时间线版 */
        .wp-timeline {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-timeline .date { font-size: 14px; color: rgba(255,255,255,0.7); }
        .wp-timeline .main { display: flex; align-items: baseline; gap: 12px; margin: 2px 0; }
        .wp-timeline .time { font-size: 34px; font-weight: 200; color: #fff; }
        .wp-timeline .weather { font-size: 13px; color: rgba(255,255,255,0.8); }
        .wp-timeline .location { font-size: 13px; color: #fff; opacity: 0.9; margin-top: 2px; }

        /* 防伪标志 - 右下角 */
        .anti-fake {
            position: absolute;
            bottom: 20px;
            right: 16px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            text-align: right;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .anti-fake .sub { font-size: 9px; opacity: 0.6; }

        /* 文件信息 */
        .file-info {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 8px;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📷 今日水印</h1>
            <span class="brand">真实可拍 · 防伪认证</span>
        </div>

        <!-- 上传 -->
        <div class="upload-area">
            <div class="upload-btn" onclick="document.getElementById('imageInput').click()">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" onclick="document.getElementById('videoInput').click()">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="loadImage(event)">
            <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="loadVideo(event)">
        </div>

        <!-- 预览 -->
        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                📸 选择照片或视频<br>
                <span style="font-size:12px;color:rgba(255,255,255,0.15)">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div id="mediaContainer" style="display:none;position:relative;width:100%;">
                <img id="previewImage" style="display:none;width:100%;max-height:500px;object-fit:contain;">
                <video id="previewVideo" style="display:none;width:100%;max-height:500px;object-fit:contain;" controls></video>
                <!-- 水印覆盖层 -->
                <div class="watermark-preview-overlay" id="watermarkOverlay"></div>
            </div>
        </div>

        <!-- 样式选择 -->
        <div class="style-selector">
            <button class="style-btn active" data-style="classic" onclick="setStyle('classic')">经典</button>
            <button class="style-btn" data-style="simple" onclick="setStyle('simple')">简洁</button>
            <button class="style-btn" data-style="timeline" onclick="setStyle('timeline')">时间线</button>
        </div>

        <!-- 编辑 -->
        <div class="edit-area">
            <div class="edit-row">
                <label>📅 日期</label>
                <input type="date" id="editDate" onchange="updateWatermark()">
            </div>
            <div class="edit-row">
                <label>⏰ 时间</label>
                <input type="time" id="editTime" onchange="updateWatermark()">
            </div>
            <div class="edit-row">
                <label>🌤️ 天气</label>
                <select id="editWeather" onchange="updateWatermark()">
                    <option value="晴">☀️ 晴</option>
                    <option value="多云">⛅ 多云</option>
                    <option value="阴">☁️ 阴</option>
                    <option value="雨">🌧️ 雨</option>
                    <option value="雪">❄️ 雪</option>
                    <option value="雾">🌫️ 雾</option>
                </select>
                <input type="number" id="editTemp" value="30" style="width:60px;min-width:60px;" onchange="updateWatermark()">
                <span style="color:rgba(255,255,255,0.3);font-size:13px;">°C</span>
            </div>
            <div class="edit-row" style="position:relative;">
                <label>📍 位置</label>
                <input type="text" id="editLocation" placeholder="输入地点，自动联想" value="张家港市·妙中小区" oninput="onLocationInput(this.value)">
            </div>
            <!-- 联想下拉 -->
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标语</label>
                <input type="text" id="editSlogan" value="醉酒当称人生几何" onchange="updateWatermark()" style="flex:1;">
            </div>
        </div>

        <!-- 防伪标志 -->
        <div class="anti-counterfeit">
            <label>
                <input type="checkbox" id="antiFake" checked onchange="updateWatermark()">
                🛡️ 防伪标志（今日水印 · 真实可拍）
            </label>
            <label style="margin-left:auto;">
                <input type="checkbox" id="showBrand" checked onchange="updateWatermark()">
                ℹ️ 品牌标识
            </label>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

        <!-- 导出按钮 -->
        <button class="export-btn" id="exportBtn" onclick="exportWatermark()">
            💾 导出带水印的文件
        </button>

        <!-- 下载区域 -->
        <div class="download-section" id="downloadSection">
            <div class="result" id="resultContainer"></div>
        </div>

        <!-- 文件信息 -->
        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 数据
        // ============================================================
        let currentStyle = 'classic';
        let currentFile = null;
        let isVideo = false;
        let mediaUrl = null;

        const mockLocations = [
            { name: '妙中小区', addr: '张家港市·杨舍镇' },
            { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
            { name: '天府广场', addr: '成都市青羊区·人民南路' },
            { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
            { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
            { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
            { name: '人民公园', addr: '成都市青羊区·祠堂街' },
            { name: '环球中心', addr: '成都市高新区·天府大道' },
            { name: '双流国际机场', addr: '成都市双流区·机场路' },
            { name: '太古里', addr: '成都市锦江区·中纱帽街' },
            { name: '九眼桥', addr: '成都市锦江区·九眼桥' },
            { name: '张家港站', addr: '张家港市·塘桥镇' },
            { name: '上海外滩', addr: '上海市黄浦区·中山东一路' },
            { name: '北京天安门', addr: '北京市东城区·长安街' },
            { name: '广州塔', addr: '广州市海珠区·阅江西路' },
            { name: '深圳湾', addr: '深圳市南山区·滨海大道' },
        ];

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            const now = new Date();
            const d = now.toISOString().split('T')[0];
            const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('editDate').value = d;
            document.getElementById('editTime').value = t;
            updateWatermark();
        }
        init();

        // ============================================================
        // 加载图片/视频
        // ============================================================
        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            loadMedia(file, false);
        }

        function loadVideo(e) {
            const file = e.target.files[0];
            if (!file) return;
            loadMedia(file, true);
        }

        function loadMedia(file, video) {
            isVideo = video;
            currentFile = file;

            const url = URL.createObjectURL(file);
            mediaUrl = url;

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('mediaContainer').style.display = 'block';

            const img = document.getElementById('previewImage');
            const vid = document.getElementById('previewVideo');

            if (video) {
                img.style.display = 'none';
                vid.style.display = 'block';
                vid.src = url;
                vid.load();
            } else {
                vid.style.display = 'none';
                img.style.display = 'block';
                img.src = url;
            }

            document.getElementById('fileInfo').textContent = 
                `📁 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

            updateWatermark();
            showToast(`✅ 已加载${video ? '视频' : '照片'}`);
        }

        // ============================================================
        // 水印渲染（实时预览）
        // ============================================================
        function updateWatermark() {
            const overlay = document.getElementById('watermarkOverlay');
            const date = document.getElementById('editDate').value;
            const time = document.getElementById('editTime').value;
            const weather = document.getElementById('editWeather').value;
            const temp = document.getElementById('editTemp').value;
            const location = document.getElementById('editLocation').value || '未知地点';
            const slogan = document.getElementById('editSlogan').value || '水印';

            const weekdays = ['日','一','二','三','四','五','六'];
            const d = new Date(date);
            const weekday = `星期${weekdays[d.getDay()]}`;

            const showAntiFake = document.getElementById('antiFake').checked;
            const showBrand = document.getElementById('showBrand').checked;

            let html = '';

            // 水印内容
            switch(currentStyle) {
                case 'classic':
                    html = `
                        <div class="wp-classic">
                            <div class="slogan">${slogan}</div>
                            <div class="datetime">${date} ${time}</div>
                            <div class="weather">${weekday} ${weather} ${temp}°C</div>
                            <div class="location">📍 ${location}</div>
                        </div>
                    `;
                    break;
                case 'simple':
                    html = `
                        <div class="wp-simple">
                            <div class="top">
                                <span class="date">${date}</span>
                                <span class="time">${time}</span>
                            </div>
                            <div class="info">
                                <span>${weekday} ${weather} ${temp}°C</span>
                                <span>📍 ${location}</span>
                            </div>
                        </div>
                    `;
                    break;
                case 'timeline':
                    html = `
                        <div class="wp-timeline">
                            <div class="date">${date} ${weekday}</div>
                            <div class="main">
                                <span class="time">${time}</span>
                                <span class="weather">${weather} ${temp}°C</span>
                            </div>
                            <div class="location">📍 ${location}</div>
                        </div>
                    `;
                    break;
            }

            // 防伪标志
            if (showAntiFake) {
                html += `
                    <div class="anti-fake">
                        今日水印<br>
                        <span class="sub">真实可拍</span>
                    </div>
                `;
            }

            // 品牌标识（与防伪一起显示或单独）
            if (showBrand && !showAntiFake) {
                html += `
                    <div class="anti-fake" style="opacity:0.2;">
                        今日水印
                    </div>
                `;
            }

            overlay.innerHTML = html;
        }

        // ============================================================
        // 样式切换
        // ============================================================
        function setStyle(style) {
            currentStyle = style;
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.style-btn[data-style="${style}"]`).classList.add('active');
            updateWatermark();
        }

        // ============================================================
        // 位置自动联想
        // ============================================================
        function onLocationInput(value) {
            const container = document.getElementById('suggestions');
            if (value.length < 2) {
                container.classList.remove('active');
                return;
            }

            const results = mockLocations.filter(item => 
                item.name.includes(value) || item.addr.includes(value)
            );

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="item" onclick="selectLocation('${value}')">
                        📌 使用 "${value}"
                        <div class="addr">自定义位置</div>
                    </div>
                `;
            } else {
                container.innerHTML = results.map(item => `
                    <div class="item" onclick="selectLocation('${item.name} · ${item.addr.split('·').pop()}')">
                        📍 ${item.name}
                        <div class="addr">${item.addr}</div>
                    </div>
                `).join('');
            }
            container.classList.add('active');
        }

        function selectLocation(loc) {
            document.getElementById('editLocation').value = loc;
            document.getElementById('suggestions').classList.remove('active');
            updateWatermark();
        }

        // 点击外部关闭联想
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.edit-area')) {
                document.getElementById('suggestions').classList.remove('active');
            }
        });

        // ============================================================
        // 导出带水印的文件
        // ============================================================
        async function exportWatermark() {
            const btn = document.getElementById('exportBtn');
            const progress = document.getElementById('progressBar');
            const fill = document.getElementById('progressFill');

            if (!currentFile) {
                showToast('⚠️ 请先选择照片或视频');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ 处理中...';
            progress.classList.add('active');

            try {
                if (isVideo) {
                    await exportVideo(btn, fill);
                } else {
                    await exportImage(btn, fill);
                }
            } catch (e) {
                console.error(e);
                showToast('❌ 处理失败: ' + e.message);
            }

            btn.disabled = false;
            btn.textContent = '💾 导出带水印的文件';
            progress.classList.remove('active');
            fill.style.width = '0%';
        }

        // ============================================================
        // 导出图片（Canvas合成）
        // ============================================================
        function exportImage(btn, fill) {
            return new Promise((resolve, reject) => {
                const img = document.getElementById('previewImage');
                if (!img.src) { reject(new Error('没有图片')); return; }

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;

                    // 绘制原图
                    ctx.drawImage(imgObj, 0, 0);

                    // 绘制水印
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    // 导出
                    const link = document.createElement('a');
                    link.download = `水印_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    fill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    resolve();
                };
                imgObj.onerror = () => reject(new Error('图片加载失败'));
                imgObj.src = img.src;
            });
        }

        // ============================================================
        // 在Canvas上绘制水印
        // ============================================================
        function drawWatermarkOnCanvas(ctx, w, h) {
            const date = document.getElementById('editDate').value;
            const time = document.getElementById('editTime').value;
            const weather = document.getElementById('editWeather').value;
            const temp = document.getElementById('editTemp').value;
            const location = document.getElementById('editLocation').value || '未知地点';
            const slogan = document.getElementById('editSlogan').value || '水印';

            const weekdays = ['日','一','二','三','四','五','六'];
            const d = new Date(date);
            const weekday = `星期${weekdays[d.getDay()]}`;

            const showAntiFake = document.getElementById('antiFake').checked;

            // 根据图片大小缩放字体
            const scale = Math.min(w, h) / 800;
            const fontSize = Math.max(14, 22 * scale);
            const smallFont = Math.max(10, 16 * scale);
            const padding = Math.max(16, 30 * scale);

            ctx.textShadowColor = 'rgba(0,0,0,0.85)';
            ctx.textShadowBlur = 8;

            let y = h - padding;

            // 根据样式绘制
            switch(currentStyle) {
                case 'classic':
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#FFD700';
                    ctx.font = `bold ${fontSize * 1.2}px "STKaiti", serif`;
                    ctx.fillText(slogan, padding, y);
                    y -= fontSize * 1.2 + 4;

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${fontSize * 0.8}px sans-serif`;
                    ctx.fillText(`${date} ${time}`, padding, y);
                    y -= fontSize * 0.8 + 2;

                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.font = `${fontSize * 0.75}px sans-serif`;
                    ctx.fillText(`${weekday} ${weather} ${temp}°C`, padding, y);
                    y -= fontSize * 0.75 + 2;

                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.fillText(`📍 ${location}`, padding, y);
                    break;

                case 'simple':
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${fontSize * 1.4}px sans-serif`;
                    ctx.fillText(date, padding, y);
                    
                    ctx.textAlign = 'right';
                    ctx.fillText(time, w - padding, y);
                    
                    y -= fontSize * 1.4 + 6;
                    ctx.textAlign = 'left';
                    ctx.font = `${fontSize * 0.75}px sans-serif`;
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.fillText(`${weekday} ${weather} ${temp}°C`, padding, y);
                    
                    ctx.textAlign = 'right';
                    ctx.fillText(`📍 ${location}`, w - padding, y);
                    break;

                case 'timeline':
                    ctx.textAlign = 'left';
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.font = `${fontSize * 0.8}px sans-serif`;
                    ctx.fillText(`${date} ${weekday}`, padding, y);
                    y -= fontSize * 0.8 + 4;

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${fontSize * 1.8}px sans-serif`;
                    ctx.fillText(time, padding, y);
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = `${fontSize * 0.8}px sans-serif`;
                    ctx.fillText(` ${weather} ${temp}°C`, padding + 100 * scale, y);
                    y -= fontSize * 1.8 + 6;

                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = `${fontSize * 0.75}px sans-serif`;
                    ctx.fillText(`📍 ${location}`, padding, y);
                    break;
            }

            // 防伪标志 - 右下角
            if (showAntiFake) {
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = `${smallFont}px sans-serif`;
                ctx.fillText('今日水印', w - padding, h - padding);
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.font = `${smallFont * 0.8}px sans-serif`;
                ctx.fillText('真实可拍', w - padding, h - padding - smallFont * 0.9);
                ctx.textBaseline = 'alphabetic';
            }

            // 重置阴影
            ctx.textShadowColor = 'transparent';
        }

        // ============================================================
        // 导出视频（使用Canvas逐帧处理）
        // ============================================================
        async function exportVideo(btn, fill) {
            const video = document.getElementById('previewVideo');
            if (!video.src) { throw new Error('没有视频'); }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // 创建视频元素用于解码
            const v = document.createElement('video');
            v.src = video.src;
            await v.play();

            canvas.width = v.videoWidth || 1280;
            canvas.height = v.videoHeight || 720;

            const duration = v.duration;
            const fps = 30;
            const totalFrames = Math.floor(duration * fps);

            // 使用MediaRecorder录制
            const stream = canvas.captureStream(fps);
            const recorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 5000000
            });

            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.start();

            let frame = 0;
            while (frame < totalFrames) {
                const time = frame / fps;
                v.currentTime = Math.min(time, duration - 0.01);
                await new Promise(r => setTimeout(r, 50));

                // 等待视频帧就绪
                await new Promise(r => {
                    const check = () => {
                        if (v.readyState >= 2) { r(); }
                        else { setTimeout(check, 50); }
                    };
                    check();
                });

                // 绘制视频帧
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                // 绘制水印
                drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                frame++;
                fill.style.width = `${(frame / totalFrames) * 100}%`;
                btn.textContent = `⏳ 处理中 ${Math.round((frame / totalFrames) * 100)}%`;
            }

            // 停止录制
            recorder.stop();
            await new Promise(r => recorder.onstop = r);

            // 导出
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `水印_${Date.now()}.webm`;
            link.href = url;
            link.click();

            showToast('✅ 视频导出成功！');
        }

        // ============================================================
        // Toast
        // ============================================================
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ============================================================
        // 快捷操作：回车触发联想选择
        // ============================================================
        document.getElementById('editLocation').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const suggestions = document.getElementById('suggestions');
                const first = suggestions.querySelector('.item');
                if (first) first.click();
                suggestions.classList.remove('active');
            }
        });

        console.log('📷 今日水印工具已加载');
        console.log('💡 选择照片或视频，添加水印后导出');
    </script>
</body>
