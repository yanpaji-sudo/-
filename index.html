<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印 - 多模板版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        .app-title {
            text-align: center;
            padding: 10px 0 18px 0;
            font-size: 18px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 2px;
        }
        .app-title span {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 400;
            display: block;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px dashed rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .upload-btn .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .upload-btn .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .preview-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .preview-section .placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
            line-height: 1.8;
        }
        .preview-section .placeholder .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .media-container {
            display: none;
            position: relative;
            width: 100%;
            min-height: 400px;
        }
        .media-container.active {
            display: block;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #111;
        }

        /* ================================================================
           水印图层 - 可拖动
           ================================================================ */
        .watermark-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .draggable-item {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            touch-action: none;
            border-radius: 6px;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item .resize-handle {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
            pointer-events: auto;
        }
        .draggable-item:hover .resize-handle {
            display: block;
        }
        .draggable-item .drag-border {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: none;
            pointer-events: none;
        }
        .draggable-item:hover .drag-border {
            display: block;
        }

        /* ================================================================
           模板1：工程记录
           ================================================================ */
        .template-engineering {
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            width: 100%;
            height: 100%;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
            min-width: 160px;
        }
        .template-engineering .header {
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            padding: 4px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 24px;
        }
        .template-engineering .header .title {
            color: #fff;
            font-size: 12px;
            font-weight: 500;
        }
        .template-engineering .header .badge {
            color: rgba(255, 255, 255, 0.5);
            font-size: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 0 10px;
            border-radius: 8px;
        }
        .template-engineering .body {
            padding: 6px 12px 8px 12px;
            background: #ffffff;
        }
        .template-engineering .body .row {
            font-size: 10px;
            line-height: 1.6;
            color: #1a1a1a;
            white-space: nowrap;
        }
        .template-engineering .body .row .lbl {
            color: #888;
        }
        .template-engineering .body .row .val {
            color: #1a1a1a;
        }
        .template-engineering .body .row .highlight {
            color: #e53935;
        }

        /* ================================================================
           模板2：经纬度水印
           ================================================================ */
        .template-gps {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 140px;
            min-height: 60px;
        }
        .template-gps .main-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .template-gps .main-row .big {
            font-size: 18px;
            font-weight: 200;
            color: #fff;
            letter-spacing: 1px;
        }
        .template-gps .main-row .date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }
        .template-gps .sub-row {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.5;
            margin-top: 2px;
        }
        .template-gps .sub-row .lbl {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ================================================================
           模板3：天气水印
           ================================================================ */
        .template-weather {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 140px;
            min-height: 60px;
        }
        .template-weather .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .template-weather .top .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .template-weather .top .left .icon {
            font-size: 24px;
        }
        .template-weather .top .left .temp {
            font-size: 18px;
            font-weight: 300;
            color: #fff;
        }
        .template-weather .top .left .desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }
        .template-weather .top .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
        }
        .template-weather .bottom {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        /* ================================================================
           模板4：打卡水印
           ================================================================ */
        .template-checkin {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 140px;
            min-height: 60px;
        }
        .template-checkin .time-big {
            font-size: 28px;
            font-weight: 200;
            color: #fff;
            letter-spacing: 2px;
        }
        .template-checkin .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        /* ================================================================
           模板5：治安巡逻
           ================================================================ */
        .template-patrol {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 140px;
            min-height: 60px;
        }
        .template-patrol .title {
            font-size: 16px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 4px;
        }
        .template-patrol .info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        /* ================================================================
           模板选择器
           ================================================================ */
        .template-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }
        .template-btn {
            padding: 8px 2px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            line-height: 1.3;
        }
        .template-btn.active {
            background: #2a7ee8;
            border-color: #2a7ee8;
            color: #fff;
        }
        .template-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .template-btn .icon {
            font-size: 16px;
            display: block;
            margin-bottom: 2px;
        }

        /* ================================================================
           编辑区
           ================================================================ */
        .edit-area {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .edit-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .edit-row:last-child {
            margin-bottom: 0;
        }

        .edit-row label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            min-width: 44px;
        }

        .edit-row input,
        .edit-row select {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            min-width: 80px;
        }
        .edit-row input:focus,
        .edit-row select:focus {
            outline: none;
            border-color: #2a7ee8;
        }
        .edit-row input[type="number"] {
            max-width: 56px;
            min-width: 48px;
        }
        .edit-row .unit {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        .suggestions {
            background: #222;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin: -4px 0 8px 0;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .suggestions.active {
            display: block;
        }
        .suggestions .item {
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: #ddd;
        }
        .suggestions .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .suggestions .item .addr {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }

        .weather-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            padding: 4px 0;
            text-align: center;
        }
        .weather-status .ok {
            color: #4CAF50;
        }
        .weather-status .loading {
            color: #FFD700;
        }

        .export-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .export-btn:hover {
            transform: scale(1.01);
            opacity: 0.92;
        }
        .export-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #2a7ee8, #64b5f6);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .file-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 10px 0 4px 0;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-16px);
            }
        }

        .hidden-input {
            display: none;
        }

        .drag-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 9px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 5;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 10px;
            display: none;
        }
        .media-container.active .drag-hint {
            display: block;
        }

        @media (max-width: 400px) {
            .template-btn {
                font-size: 7px;
            }
            .template-btn .icon {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="app-title">
            📷 今日水印相机
            <span>5种模板 · 自由拖动 · 自动天气</span>
        </div>

        <div class="upload-area">
            <div class="upload-btn" id="uploadImageBtn">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" id="uploadVideoBtn">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" class="hidden-input" accept="image/*">
            <input type="file" id="videoInput" class="hidden-input" accept="video/*">
        </div>

        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                <span class="big-icon">📸</span>
                选择照片或视频<br>
                <span style="font-size:11px;color:rgba(255,255,255,0.1);">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div class="media-container" id="mediaContainer">
                <img id="previewImage" style="display:none;width:100%;max-height:500px;object-fit:contain;background:#111;">
                <video id="previewVideo" style="display:none;width:100%;max-height:500px;object-fit:contain;background:#111;" controls></video>
                <div class="watermark-layer" id="watermarkLayer"></div>
                <div class="drag-hint" id="dragHint">↕ 拖拽移动 · 右下角缩放</div>
            </div>
        </div>

        <!-- 模板选择 -->
        <div class="template-selector" id="templateSelector">
            <button class="template-btn active" data-template="engineering">
                <span class="icon">🏗️</span>工程记录
            </button>
            <button class="template-btn" data-template="gps">
                <span class="icon">📍</span>经纬度
            </button>
            <button class="template-btn" data-template="weather">
                <span class="icon">🌤️</span>天气
            </button>
            <button class="template-btn" data-template="checkin">
                <span class="icon">📌</span>打卡
            </button>
            <button class="template-btn" data-template="patrol">
                <span class="icon">🚔</span>治安巡逻
            </button>
        </div>

        <!-- 天气状态 -->
        <div class="weather-status" id="weatherStatus">🌐 正在获取天气...</div>

        <!-- 编辑 -->
        <div class="edit-area">
            <div class="edit-row">
                <label>📍 地点</label>
                <input type="text" id="editLocation" placeholder="输入地点" value="北京国贸" style="flex:2;min-width:120px;">
            </div>
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标题</label>
                <input type="text" id="editTitle" value="工程记录" style="flex:1;">
            </div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <button class="export-btn" id="exportBtn">💾 导出带水印的文件</button>

        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM
            // ============================================================
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const imageInput = document.getElementById('imageInput');
            const videoInput = document.getElementById('videoInput');
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const mediaContainer = document.getElementById('mediaContainer');
            const placeholder = document.getElementById('placeholder');
            const watermarkLayer = document.getElementById('watermarkLayer');
            const editLocation = document.getElementById('editLocation');
            const editTitle = document.getElementById('editTitle');
            const suggestions = document.getElementById('suggestions');
            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const fileInfo = document.getElementById('fileInfo');
            const toast = document.getElementById('toast');
            const weatherStatus = document.getElementById('weatherStatus');

            // ============================================================
            // 状态
            // ============================================================
            let currentTemplate = 'engineering';
            let currentFile = null;
            let isVideo = false;
            let mediaUrl = null;

            // 水印位置状态（每个模板独立）
            let templateStates = {
                engineering: { x: 30, y: 50, w: 200, h: 90 },
                gps: { x: 30, y: 160, w: 160, h: 60 },
                weather: { x: 30, y: 280, w: 170, h: 65 },
                checkin: { x: 30, y: 390, w: 150, h: 55 },
                patrol: { x: 200, y: 50, w: 140, h: 55 }
            };

            // 天气数据
            let weatherData = {
                temp: '5',
                condition: '多云',
                wind: '东风3级',
                city: '北京',
                icon: '⛅'
            };

            // ============================================================
            // 位置数据
            // ============================================================
            const mockLocations = [
                { name: '中国尊建筑大厦', addr: '北京国贸' },
                { name: '国贸', addr: '北京国贸' },
                { name: '四姑娘山', addr: '四川成都四姑娘山' },
                { name: '象牙山村', addr: '辽宁·铁岭市·象牙山村' },
                { name: '幻想咖啡厅', addr: '上海浦东·幻想咖啡厅' },
                { name: '珠穆朗玛峰', addr: '西藏·珠穆朗玛峰' },
                { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
                { name: '天府广场', addr: '成都市青羊区·人民南路' },
                { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
                { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
                { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
                { name: '人民公园', addr: '成都市青羊区·祠堂街' },
                { name: '环球中心', addr: '成都市高新区·天府大道' },
                { name: '双流国际机场', addr: '成都市双流区·机场路' },

                { name: '九眼桥', addr: '成都市锦江区·九眼桥' },

            // ============================================================
            // 获取真实天气（免费API）
            // ============================================================
            async function fetchRealWeather() {
                try {
                    weatherStatus.textContent = '🌐 正在获取天气...';
                    weatherStatus.className = 'weather-status loading';

                    // 1. 获取IP所在城市
                    const ipRes = await fetch('https://ip-api.com/json/');
                    const ipData = await ipRes.json();
                    const city = ipData.city || '北京';
                    const lat = ipData.lat || 39.9;
                    const lon = ipData.lon || 116.4;

                    // 2. 获取天气
                    const weatherRes = await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`
                    );
                    const weatherJson = await weatherRes.json();

                    if (weatherJson.current_weather) {
                        const temp = Math.round(weatherJson.current_weather.temperature);
                        const code = weatherJson.current_weather.weathercode;

                        // 天气代码转文字
                        const weatherMap = {
                            0: { text: '晴', icon: '☀️' },
                            1: { text: '晴', icon: '☀️' },
                            2: { text: '多云', icon: '⛅' },
                            3: { text: '阴', icon: '☁️' },
                            45: { text: '雾', icon: '🌫️' },
                            48: { text: '雾', icon: '🌫️' },
                            51: { text: '小雨', icon: '🌦️' },
                            53: { text: '小雨', icon: '🌦️' },
                            55: { text: '小雨', icon: '🌦️' },
                            61: { text: '小雨', icon: '🌧️' },
                            63: { text: '中雨', icon: '🌧️' },
                            65: { text: '大雨', icon: '🌧️' },
                            71: { text: '小雪', icon: '❄️' },
                            73: { text: '中雪', icon: '❄️' },
                            75: { text: '大雪', icon: '❄️' },
                            80: { text: '阵雨', icon: '🌦️' },
                            95: { text: '雷雨', icon: '⛈️' },
                        };

                        const w = weatherMap[code] || { text: '晴', icon: '☀️' };

                        weatherData = {
                            temp: temp,
                            condition: w.text,
                            wind: '东风3级',
                            city: city,
                            icon: w.icon
                        };

                        weatherStatus.textContent = `✅ 天气已获取：${city} ${w.icon} ${temp}°C ${w.text}`;
                        weatherStatus.className = 'weather-status ok';
                    } else {
                        throw new Error('天气数据无效');
                    }
                } catch (e) {
                    console.warn('天气获取失败，使用默认数据', e);
                    weatherData = {
                        temp: '22',
                        condition: '晴',
                        wind: '微风',
                        city: '北京',
                        icon: '☀️'
                    };
                    weatherStatus.textContent = '⚠️ 使用默认天气（可手动编辑）';
                    weatherStatus.className = 'weather-status';
                }

                // 更新水印
                renderWatermarks();
            }

            function getNow() {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                return {
                    date: y + '.' + m + '.' + d,
                    time: h + ':' + min,
                    fullTime: y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s,
                    weekday: weekdays[now.getDay()],
                    year: y,
                    month: m,
                    day: d,
                    hour: h,
                    minute: min,
                    second: s
                };
            }

            // ============================================================

            function renderWatermarks() {
                const layer = watermarkLayer;
                const container = mediaContainer;
                const rect = container.getBoundingClientRect();
                const scale = rect.width / 420 || 1;

                const state = templateStates[currentTemplate];
                const html = `
                    <div class="draggable-item" id="watermarkItem" 
                         style="left:${state.x * scale}px; top:${state.y * scale}px; width:${state.w * scale}px; height:${state.h * scale}px;"
                         data-x="${state.x}" data-y="${state.y}" data-w="${state.w}" data-h="${state.h}">
                        <div class="drag-border"></div>
                        ${buildTemplateHTML(currentTemplate)}
                        <div class="resize-handle" id="resizeHandle"></div>
                    </div>
                `;

                layer.innerHTML = html;

                setTimeout(() => {
                    initDraggable();
                }, 50);
            }

            // ============================================================
            // 拖动系统
            // ============================================================
            function initDraggable() {
                const el = document.getElementById('watermarkItem');
                if (!el) return;

                const container = mediaContainer;
                let isDragging = false;
                let isResizing = false;
                let startX, startY, startW, startH, startMX, startMY;

                el.addEventListener('mousedown', function(e) {
                    if (e.target.closest('.resize-handle')) return;
                    isDragging = true;
                    const rect = container.getBoundingClientRect();
                    startX = e.clientX;
                    startY = e.clientY;
                    const scale = rect.width / 420 || 1;
                    startMX = parseFloat(el.dataset.x) || 0;
                    startMY = parseFloat(el.dataset.y) || 0;
                    el.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                const resizeHandle = document.getElementById('resizeHandle');
                if (resizeHandle) {
                    resizeHandle.addEventListener('mousedown', function(e) {
                        e.stopPropagation();
                        isResizing = true;
                        const rect = container.getBoundingClientRect();
                        startX = e.clientX;
                        startY = e.clientY;
                        const scale = rect.width / 420 || 1;
                        startW = parseFloat(el.dataset.w) || 200;
                        startH = parseFloat(el.dataset.h) || 100;
                        el.style.cursor = 'nwse-resize';
                        e.preventDefault();
                    });
                }

                document.addEventListener('mousemove', function(e) {
                    const rect = container.getBoundingClientRect();
                    const scale = rect.width / 420 || 1;

                    if (isDragging) {
                        const dx = (e.clientX - startX) / scale;
                        const dy = (e.clientY - startY) / scale;
                        const newX = Math.max(0, startMX + dx);
                        const newY = Math.max(0, startMY + dy);
                        el.dataset.x = newX;
                        el.dataset.y = newY;
                        el.style.left = (newX * scale) + 'px';
                        el.style.top = (newY * scale) + 'px';
                        templateStates[currentTemplate].x = newX;
                        templateStates[currentTemplate].y = newY;
                    }

                    if (isResizing) {
                        const dw = (e.clientX - startX) / scale;
                        const dh = (e.clientY - startY) / scale;
                        const newW = Math.max(80, startW + dw);
                        const newH = Math.max(50, startH + dh);
                        el.dataset.w = newW;
                        el.dataset.h = newH;
                        el.style.width = (newW * scale) + 'px';
                        el.style.height = (newH * scale) + 'px';
                        templateStates[currentTemplate].w = newW;
                        templateStates[currentTemplate].h = newH;
                    }
                });

                document.addEventListener('mouseup', function() {
                    if (isDragging) {
                        isDragging = false;
                        el.style.cursor = 'grab';
                    }
                    if (isResizing) {
                        isResizing = false;
                        el.style.cursor = 'default';
                    }
                });

                // 触摸支持
                let touchStartX, touchStartY, touchStartW, touchStartH, touchStartMX, touchStartMY;
                let touchDist = 0;

                el.addEventListener('touchstart', function(e) {
                    const touches = e.touches;
                    if (touches.length === 1 && !e.target.closest('.resize-handle')) {
                        isDragging = true;
                        const rect = container.getBoundingClientRect();
                        const scale = rect.width / 420 || 1;
                        touchStartX = touches[0].clientX;
                        touchStartY = touches[0].clientY;
                        touchStartMX = parseFloat(el.dataset.x) || 0;
                        touchStartMY = parseFloat(el.dataset.y) || 0;
                        e.preventDefault();
                    } else if (touches.length === 2) {
                        isResizing = true;
                        const rect = container.getBoundingClientRect();
                        const scale = rect.width / 420 || 1;
                        touchStartW = parseFloat(el.dataset.w) || 200;
                        touchStartH = parseFloat(el.dataset.h) || 100;
                        touchDist = Math.hypot(touches[0].clientX - touches[1].clientX,
                            touches[0].clientY - touches[1].clientY);
                        e.preventDefault();
                    }
                });

                el.addEventListener('touchmove', function(e) {
                    const rect = container.getBoundingClientRect();
                    const scale = rect.width / 420 || 1;
                    const touches = e.touches;

                    if (isDragging && touches.length === 1) {
                        const dx = (touches[0].clientX - touchStartX) / scale;
                        const dy = (touches[0].clientY - touchStartY) / scale;
                        const newX = Math.max(0, touchStartMX + dx);
                        const newY = Math.max(0, touchStartMY + dy);
                        el.dataset.x = newX;
                        el.dataset.y = newY;
                        el.style.left = (newX * scale) + 'px';
                        el.style.top = (newY * scale) + 'px';
                        templateStates[currentTemplate].x = newX;
                        templateStates[currentTemplate].y = newY;
                        e.preventDefault();
                    }

                    if (isResizing && touches.length === 2) {
                        const newDist = Math.hypot(touches[0].clientX - touches[1].clientX,
                            touches[0].clientY - touches[1].clientY);
                        const ratio = newDist / touchDist;
                        const newW = Math.max(80, touchStartW * ratio);
                        const newH = Math.max(50, touchStartH * ratio);
                        el.dataset.w = newW;
                        el.dataset.h = newH;
                        el.style.width = (newW * scale) + 'px';
                        el.style.height = (newH * scale) + 'px';
                        templateStates[currentTemplate].w = newW;
                        templateStates[currentTemplate].h = newH;
                        e.preventDefault();
                    }
                });

                el.addEventListener('touchend', function() {
                    isDragging = false;
                    isResizing = false;
                });
            }

            // ============================================================
            // Canvas导出
            // ============================================================
            function drawWatermarkOnCanvas(ctx, w, h) {
                const now = getNow();
                const loc = editLocation.value || '北京国贸';
                const title = editTitle.value || '工程记录';
                const gps = getRandomGPS();
                const wd = weatherData;

                const state = templateStates[currentTemplate];
                const scale = Math.min(w, h) / 800;
                const cx = state.x * (w / 420);
                const cy = state.y * (h / 700);
                const cw = state.w * (w / 420);
                const ch = state.h * (h / 700);

                // 绘制模板
                ctx.save();

                // 半透明背景
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12 * scale;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath();
                ctx.roundRect(cx, cy, cw, ch, 6 * scale);
                ctx.fill();
                ctx.shadowBlur = 0;

                const pad = 10 * scale;
                const font = 10 * scale;
                const smallFont = 8 * scale;

                ctx.fillStyle = '#ffffff';
                ctx.font = font + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                // 简化绘制：根据模板显示不同内容
                let yPos = cy + pad;

                if (currentTemplate === 'engineering') {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '600 ' + (12 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillText(title, cx + pad, yPos);
                    yPos += 16 * scale;

                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = smallFont + 'px -apple-system, sans-serif';
                    ctx.fillText('经度：' + gps.lon, cx + pad, yPos);
                    yPos += 12 * scale;
                    ctx.fillText('纬度：' + gps.lat, cx + pad, yPos);
                    yPos += 12 * scale;
                    ctx.fillText('地点：' + loc, cx + pad, yPos);
                    yPos += 12 * scale;
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.fillText(wd.icon + ' ' + wd.condition + ' ' + wd.temp + '°C ' + wd.wind, cx + pad, yPos);
                    yPos += 12 * scale;
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillText(now.fullTime, cx + pad, yPos);

                } else if (currentTemplate === 'gps') {
                    ctx.font = '300 ' + (18 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(Math.round(Math.random() * 20 + 10) + '°', cx + pad, yPos);
                    ctx.font = smallFont + 'px -apple-system, sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.textAlign = 'right';
                    ctx.fillText(now.date + ' ' + now.weekday, cx + cw - pad, yPos + 4 * scale);
                    ctx.textAlign = 'left';
                    yPos += 22 * scale;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillText('经度：' + gps.lon + '  纬度：' + gps.lat, cx + pad, yPos);
                    yPos += 12 * scale;
                    ctx.fillText('地址：' + loc, cx + pad, yPos);

                } else if (currentTemplate === 'weather') {
                    ctx.font = '28 * scale' + 'px -apple-system, sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(wd.icon, cx + pad, yPos - 4 * scale);
                    ctx.font = '300 ' + (18 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillText(wd.temp + '°', cx + pad + 32 * scale, yPos + 2 * scale);
                    ctx.font = smallFont + 'px -apple-system, sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.textAlign = 'right';
                    ctx.fillText(now.time, cx + cw - pad, yPos + 4 * scale);
                    ctx.textAlign = 'left';
                    yPos += 28 * scale;
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillText(wd.condition + ' ' + wd.wind + ' · ' + loc, cx + pad, yPos);

                } else if (currentTemplate === 'checkin') {
                    ctx.font = '200 ' + (28 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(now.time, cx + pad, yPos);
                    ctx.font = smallFont + 'px -apple-system, sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    yPos += 32 * scale;
                    ctx.fillText(now.date + ' ' + now.weekday + '  ' + loc, cx + pad, yPos);

                } else if (currentTemplate === 'patrol') {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '600 ' + (16 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillText('治安巡逻', cx + pad, yPos);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = smallFont + 'px -apple-system, sans-serif';
                    yPos += 20 * scale;
                    ctx.fillText(now.date + '  ' + now.time + '  ' + loc, cx + pad, yPos);
                }

                ctx.restore();
            }

            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            function exportImage() {
                const img = previewImage;
                if (!img.src || img.style.display === 'none') {
                    showToast('⚠️ 没有图片可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    ctx.drawImage(imgObj, 0, 0);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1000);
                };
                imgObj.onerror = function() {
                    showToast('❌ 图片加载失败');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    progressBar.classList.remove('active');
                };
                imgObj.src = img.src;
            }

            function exportVideo() {
                const video = previewVideo;
                if (!video.src || video.style.display === 'none') {
                    showToast('⚠️ 没有视频可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印视频帧_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 视频帧导出成功！');
                } catch (e) {
                    showToast('❌ 导出失败: ' + e.message);
                }

                exportBtn.disabled = false;
                exportBtn.textContent = '💾 导出带水印的文件';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
            }

            // ============================================================
            // 窗口变化重新渲染
            // ============================================================
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderWatermarks, 200);
            });

            // ============================================================
            // 定时刷新时间（每分钟）
            // ============================================================
            setInterval(function() {
                if (mediaContainer.classList.contains('active')) {
                    renderWatermarks();
                }
            }, 60000);

            // ============================================================
            // 初始化
            // ============================================================
            fetchRealWeather();
            renderWatermarks();

            console.log('📷 今日水印 - 5模板版');
            console.log('✅ 模板：工程记录 / 经纬度 / 天气 / 打卡 / 治安巡逻');
            console.log('✅ 自动获取真实天气');
            console.log('✅ 每个模板独立拖动和缩放');

        })();
    </script>
</body>
</html>
