<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印 - 照片/视频水印工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; font-weight: 600; color: #FFD700; }
        .header .brand { font-size: 12px; color: rgba(255,255,255,0.3); }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .upload-btn {
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .upload-btn:hover { background: rgba(255,255,255,0.1); border-color: #4CAF50; }
        .upload-btn .icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .upload-btn .label { font-size: 13px; color: rgba(255,255,255,0.6); }

        .preview-section {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-section img, .preview-section video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }
        .preview-section .placeholder {
            color: rgba(255,255,255,0.2);
            font-size: 14px;
            padding: 40px;
            text-align: center;
        }

        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .style-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 0;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .style-btn.active { background: #4CAF50; border-color: #4CAF50; color: #fff; }
        .style-btn:hover { background: rgba(255,255,255,0.05); }

        .edit-area {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .edit-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .edit-row label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            min-width: 50px;
        }
        .edit-row input, .edit-row select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            min-width: 100px;
        }
        .edit-row input:focus, .edit-row select:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .edit-row input[type="number"] { min-width: 60px; max-width: 70px; }
        .edit-row .temp-label { color: rgba(255,255,255,0.3); font-size: 13px; }

        .suggestions {
            background: #2a2a2a;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-top: -6px;
            margin-bottom: 8px;
            display: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .suggestions.active { display: block; }
        .suggestions .item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            color: #fff;
        }
        .suggestions .item:hover { background: rgba(255,255,255,0.08); }
        .suggestions .item .addr { font-size: 11px; color: rgba(255,255,255,0.3); }

        .anti-counterfeit {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,215,0,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,215,0,0.1);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .anti-counterfeit label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .anti-counterfeit input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #FFD700;
            cursor: pointer;
        }

        .export-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .export-btn:hover { transform: scale(1.01); opacity: 0.9; }
        .export-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 12px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .file-info {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 8px;
            margin-top: 8px;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* 水印覆盖层 */
        .watermark-preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        .wp-classic {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-classic .slogan { font-size: 20px; font-weight: bold; color: #FFD700; font-family: 'STKaiti', serif; margin-bottom: 2px; }
        .wp-classic .datetime { font-size: 14px; color: #fff; opacity: 0.9; }
        .wp-classic .weather { font-size: 13px; color: #fff; opacity: 0.8; }
        .wp-classic .location { font-size: 13px; color: #fff; opacity: 0.9; margin-top: 2px; }

        .wp-simple {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-simple .top { display: flex; justify-content: space-between; align-items: flex-end; }
        .wp-simple .date { font-size: 26px; font-weight: 300; color: #fff; }
        .wp-simple .time { font-size: 26px; font-weight: 300; color: #fff; }
        .wp-simple .info { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 2px; }

        .wp-timeline {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .wp-timeline .date { font-size: 14px; color: rgba(255,255,255,0.7); }
        .wp-timeline .main { display: flex; align-items: baseline; gap: 12px; margin: 2px 0; }
        .wp-timeline .time { font-size: 34px; font-weight: 200; color: #fff; }
        .wp-timeline .weather { font-size: 13px; color: rgba(255,255,255,0.8); }
        .wp-timeline .location { font-size: 13px; color: #fff; opacity: 0.9; margin-top: 2px; }

        .anti-fake {
            position: absolute;
            bottom: 20px;
            right: 16px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            text-align: right;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .anti-fake .sub { font-size: 9px; opacity: 0.6; }

        .media-container {
            display: none;
            position: relative;
            width: 100%;
        }
        .media-container.active { display: block; }
        .media-container img, .media-container video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📷 今日水印</h1>
            <span class="brand">真实可拍 · 防伪认证</span>
        </div>

        <!-- 上传区域 -->
        <div class="upload-area">
            <div class="upload-btn" id="uploadImageBtn">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" id="uploadVideoBtn">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" class="hidden-input" accept="image/*">
            <input type="file" id="videoInput" class="hidden-input" accept="video/*">
        </div>

        <!-- 预览 -->
        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                📸 选择照片或视频<br>
                <span style="font-size:12px;color:rgba(255,255,255,0.15)">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div class="media-container" id="mediaContainer">
                <img id="previewImage" style="display:none;width:100%;max-height:500px;object-fit:contain;">
                <video id="previewVideo" style="display:none;width:100%;max-height:500px;object-fit:contain;" controls></video>
                <div class="watermark-preview-overlay" id="watermarkOverlay"></div>
            </div>
        </div>

        <!-- 样式选择 -->
        <div class="style-selector">
            <button class="style-btn active" data-style="classic">经典</button>
            <button class="style-btn" data-style="simple">简洁</button>
            <button class="style-btn" data-style="timeline">时间线</button>
        </div>

        <!-- 编辑 -->
        <div class="edit-area">
            <div class="edit-row">
                <label>📅 日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="edit-row">
                <label>⏰ 时间</label>
                <input type="time" id="editTime">
            </div>
            <div class="edit-row">
                <label>🌤️ 天气</label>
                <select id="editWeather">
                    <option value="晴">☀️ 晴</option>
                    <option value="多云">⛅ 多云</option>
                    <option value="阴">☁️ 阴</option>
                    <option value="雨">🌧️ 雨</option>
                    <option value="雪">❄️ 雪</option>
                    <option value="雾">🌫️ 雾</option>
                </select>
                <input type="number" id="editTemp" value="30" min="-30" max="50">
                <span class="temp-label">°C</span>
            </div>
            <div class="edit-row" style="position:relative;flex-wrap:wrap;">
                <label>📍 位置</label>
                <input type="text" id="editLocation" placeholder="输入地点，自动联想" value="张家港市·妙中小区" style="flex:1;min-width:150px;">
            </div>
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标语</label>
                <input type="text" id="editSlogan" value="醉酒当称人生几何" style="flex:1;">
            </div>
        </div>

        <!-- 防伪 -->
        <div class="anti-counterfeit">
            <label>
                <input type="checkbox" id="antiFake" checked>
                🛡️ 防伪标志
            </label>
            <label>
                <input type="checkbox" id="showBrand" checked>
                ℹ️ 品牌标识
            </label>
        </div>

        <!-- 进度 -->
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- 导出 -->
        <button class="export-btn" id="exportBtn">💾 导出带水印的文件</button>

        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM 引用
            // ============================================================
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const imageInput = document.getElementById('imageInput');
            const videoInput = document.getElementById('videoInput');
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const mediaContainer = document.getElementById('mediaContainer');
            const placeholder = document.getElementById('placeholder');
            const watermarkOverlay = document.getElementById('watermarkOverlay');
            const editDate = document.getElementById('editDate');
            const editTime = document.getElementById('editTime');
            const editWeather = document.getElementById('editWeather');
            const editTemp = document.getElementById('editTemp');
            const editLocation = document.getElementById('editLocation');
            const editSlogan = document.getElementById('editSlogan');
            const suggestions = document.getElementById('suggestions');
            const antiFake = document.getElementById('antiFake');
            const showBrand = document.getElementById('showBrand');
            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const fileInfo = document.getElementById('fileInfo');
            const toast = document.getElementById('toast');

            // ============================================================
            // 状态
            // ============================================================
            let currentStyle = 'classic';
            let currentFile = null;
            let isVideo = false;
            let mediaUrl = null;

            // ============================================================
            // 模拟位置数据
            // ============================================================
            const mockLocations = [
                { name: '妙中小区', addr: '张家港市·杨舍镇' },
                { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
                { name: '天府广场', addr: '成都市青羊区·人民南路' },
                { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
                { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
                { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
                { name: '人民公园', addr: '成都市青羊区·祠堂街' },
                { name: '环球中心', addr: '成都市高新区·天府大道' },
                { name: '双流国际机场', addr: '成都市双流区·机场路' },
                { name: '太古里', addr: '成都市锦江区·中纱帽街' },
                { name: '九眼桥', addr: '成都市锦江区·九眼桥' },
                { name: '张家港站', addr: '张家港市·塘桥镇' },
                { name: '上海外滩', addr: '上海市黄浦区·中山东一路' },
                { name: '北京天安门', addr: '北京市东城区·长安街' },
                { name: '广州塔', addr: '广州市海珠区·阅江西路' },
                { name: '深圳湾', addr: '深圳市南山区·滨海大道' },
            ];

            // ============================================================
            // Toast
            // ============================================================
            let toastTimer = null;
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ============================================================
            // 初始化日期时间
            // ============================================================
            function initDateTime() {
                const now = new Date();
                const d = now.toISOString().split('T')[0];
                const t = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                editDate.value = d;
                editTime.value = t;
            }
            initDateTime();

            // ============================================================
            // 上传事件绑定
            // ============================================================
            uploadImageBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                imageInput.click();
            });

            uploadVideoBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                videoInput.click();
            });

            // ============================================================
            // 文件加载
            // ============================================================
            imageInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], false);
                }
                this.value = '';
            });

            videoInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], true);
                }
                this.value = '';
            });

            function loadFile(file, video) {
                isVideo = video;
                currentFile = file;

                const url = URL.createObjectURL(file);
                mediaUrl = url;

                placeholder.style.display = 'none';
                mediaContainer.classList.add('active');

                if (video) {
                    previewImage.style.display = 'none';
                    previewVideo.style.display = 'block';
                    previewVideo.src = url;
                    previewVideo.load();
                } else {
                    previewVideo.style.display = 'none';
                    previewImage.style.display = 'block';
                    previewImage.src = url;
                }

                fileInfo.textContent = '📁 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                updateWatermark();
                showToast('✅ 已加载' + (video ? '视频' : '照片'));
            }

            // ============================================================
            // 水印渲染
            // ============================================================
            function updateWatermark() {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '19:34';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '30';
                const location = editLocation.value || '未知地点';
                const slogan = editSlogan.value || '水印';

                const weekdays = ['日','一','二','三','四','五','六'];
                const d = new Date(date);
                const weekday = '星期' + weekdays[d.getDay()];

                const showAntiFake = antiFake.checked;
                const showBrandFlag = showBrand.checked;

                let html = '';

                switch(currentStyle) {
                    case 'classic':
                        html = `
                            <div class="wp-classic">
                                <div class="slogan">${slogan}</div>
                                <div class="datetime">${date} ${time}</div>
                                <div class="weather">${weekday} ${weather} ${temp}°C</div>
                                <div class="location">📍 ${location}</div>
                            </div>
                        `;
                        break;
                    case 'simple':
                        html = `
                            <div class="wp-simple">
                                <div class="top">
                                    <span class="date">${date}</span>
                                    <span class="time">${time}</span>
                                </div>
                                <div class="info">
                                    <span>${weekday} ${weather} ${temp}°C</span>
                                    <span>📍 ${location}</span>
                                </div>
                            </div>
                        `;
                        break;
                    case 'timeline':
                        html = `
                            <div class="wp-timeline">
                                <div class="date">${date} ${weekday}</div>
                                <div class="main">
                                    <span class="time">${time}</span>
                                    <span class="weather">${weather} ${temp}°C</span>
                                </div>
                                <div class="location">📍 ${location}</div>
                            </div>
                        `;
                        break;
                }

                if (showAntiFake) {
                    html += `
                        <div class="anti-fake">
                            今日水印<br>
                            <span class="sub">真实可拍</span>
                        </div>
                    `;
                } else if (showBrandFlag) {
                    html += `
                        <div class="anti-fake" style="opacity:0.2;">
                            今日水印
                        </div>
                    `;
                }

                watermarkOverlay.innerHTML = html;
            }

            // ============================================================
            // 样式切换
            // ============================================================
            document.querySelectorAll('.style-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStyle = this.dataset.style;
                    updateWatermark();
                });
            });

            // ============================================================
            // 编辑事件绑定
            // ============================================================
            editDate.addEventListener('change', updateWatermark);
            editTime.addEventListener('change', updateWatermark);
            editWeather.addEventListener('change', updateWatermark);
            editTemp.addEventListener('change', updateWatermark);
            editSlogan.addEventListener('input', updateWatermark);
            antiFake.addEventListener('change', updateWatermark);
            showBrand.addEventListener('change', updateWatermark);

            // ============================================================
            // 位置自动联想
            // ============================================================
            editLocation.addEventListener('input', function() {
                const value = this.value;
                if (value.length < 2) {
                    suggestions.classList.remove('active');
                    return;
                }

                const results = mockLocations.filter(function(item) {
                    return item.name.includes(value) || item.addr.includes(value);
                });

                if (results.length === 0) {
                    suggestions.innerHTML = `
                        <div class="item" onclick="window.selectLocation('${value}')">
                            📌 使用 "${value}"
                            <div class="addr">自定义位置</div>
                        </div>
                    `;
                } else {
                    suggestions.innerHTML = results.map(function(item) {
                        const parts = item.addr.split('·');
                        const shortAddr = parts.length > 1 ? parts[parts.length - 1] : item.addr;
                        return `
                            <div class="item" onclick="window.selectLocation('${item.name} · ${shortAddr}')">
                                📍 ${item.name}
                                <div class="addr">${item.addr}</div>
                            </div>
                        `;
                    }).join('');
                }
                suggestions.classList.add('active');
            });

            editLocation.addEventListener('blur', function() {
                setTimeout(function() {
                    suggestions.classList.remove('active');
                }, 300);
            });

            editLocation.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const first = suggestions.querySelector('.item');
                    if (first) first.click();
                    suggestions.classList.remove('active');
                }
            });

            window.selectLocation = function(loc) {
                editLocation.value = loc;
                suggestions.classList.remove('active');
                updateWatermark();
                showToast('📍 位置已更新: ' + loc);
            };

            // 点击外部关闭联想
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.edit-area')) {
                    suggestions.classList.remove('active');
                }
            });

            // ============================================================
            // 导出
            // ============================================================
            exportBtn.addEventListener('click', function() {
                if (!currentFile) {
                    showToast('⚠️ 请先选择照片或视频');
                    return;
                }
                if (isVideo) {
                    exportVideo();
                } else {
                    exportImage();
                }
            });

            function exportImage() {
                const img = previewImage;
                if (!img.src || img.style.display === 'none') {
                    showToast('⚠️ 没有图片可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    ctx.drawImage(imgObj, 0, 0);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    link.download = '水印_' + Date.now() + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    setTimeout(function() {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1000);
                };
                imgObj.onerror = function() {
                    showToast('❌ 图片加载失败');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    progressBar.classList.remove('active');
                };
                imgObj.src = img.src;
            }

            function drawWatermarkOnCanvas(ctx, w, h) {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '19:34';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '30';
                const location = editLocation.value || '未知地点';
                const slogan = editSlogan.value || '水印';

                const weekdays = ['日','一','二','三','四','五','六'];
                const d = new Date(date);
                const weekday = '星期' + weekdays[d.getDay()];

                const showAntiFake = antiFake.checked;

                const scale = Math.min(w, h) / 800;
                const fontSize = Math.max(14, 22 * scale);
                const smallFont = Math.max(10, 16 * scale);
                const padding = Math.max(16, 30 * scale);

                ctx.textShadowColor = 'rgba(0,0,0,0.85)';
                ctx.textShadowBlur = 8;

                let y = h - padding;

                switch(currentStyle) {
                    case 'classic':
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#FFD700';
                        ctx.font = 'bold ' + (fontSize * 1.2) + 'px "STKaiti", serif';
                        ctx.fillText(slogan, padding, y);
                        y -= fontSize * 1.2 + 4;

                        ctx.fillStyle = '#ffffff';
                        ctx.font = (fontSize * 0.8) + 'px sans-serif';
                        ctx.fillText(date + ' ' + time, padding, y);
                        y -= fontSize * 0.8 + 2;

                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                        ctx.font = (fontSize * 0.75) + 'px sans-serif';
                        ctx.fillText(weekday + ' ' + weather + ' ' + temp + '°C', padding, y);
                        y -= fontSize * 0.75 + 2;

                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.font = (fontSize * 0.75) + 'px sans-serif';
                        ctx.fillText('📍 ' + location, padding, y);
                        break;

                    case 'simple':
                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#ffffff';
                        ctx.font = (fontSize * 1.4) + 'px sans-serif';
                        ctx.fillText(date, padding, y);

                        ctx.textAlign = 'right';
                        ctx.fillText(time, w - padding, y);

                        y -= fontSize * 1.4 + 6;
                        ctx.textAlign = 'left';
                        ctx.font = (fontSize * 0.75) + 'px sans-serif';
                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                        ctx.fillText(weekday + ' ' + weather + ' ' + temp + '°C', padding, y);

                        ctx.textAlign = 'right';
                        ctx.fillText('📍 ' + location, w - padding, y);
                        break;

                    case 'timeline':
                        ctx.textAlign = 'left';
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.font = (fontSize * 0.8) + 'px sans-serif';
                        ctx.fillText(date + ' ' + weekday, padding, y);
                        y -= fontSize * 0.8 + 4;

                        ctx.fillStyle = '#ffffff';
                        ctx.font = (fontSize * 1.8) + 'px sans-serif';
                        ctx.fillText(time, padding, y);

                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.font = (fontSize * 0.8) + 'px sans-serif';
                        ctx.fillText(' ' + weather + ' ' + temp + '°C', padding + 100 * scale, y);
                        y -= fontSize * 1.8 + 6;

                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.font = (fontSize * 0.75) + 'px sans-serif';
                        ctx.fillText('📍 ' + location, padding, y);
                        break;
                }

                if (showAntiFake) {
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = smallFont + 'px sans-serif';
                    ctx.fillText('今日水印', w - padding, h - padding);
                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    ctx.font = (smallFont * 0.8) + 'px sans-serif';
                    ctx.fillText('真实可拍', w - padding, h - padding - smallFont * 0.9);
                    ctx.textBaseline = 'alphabetic';
                }

                ctx.textShadowColor = 'transparent';
            }

            // ============================================================
            // 视频导出（简化版 - 使用Canvas截图）
            // ============================================================
            async function exportVideo() {
                const video = previewVideo;
                if (!video.src || video.style.display === 'none') {
                    showToast('⚠️ 没有视频可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                try {
                    // 简单方案：导出当前帧作为预览
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    link.download = '水印视频预览_' + Date.now() + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 视频帧导出成功！(完整视频合成需服务器端处理)');
                } catch (e) {
                    showToast('❌ 导出失败: ' + e.message);
                }

                exportBtn.disabled = false;
                exportBtn.textContent = '💾 导出带水印的文件';
                setTimeout(function() {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
            }

            // ============================================================
            // 初始渲染
            // ============================================================
            updateWatermark();

            console.log('📷 今日水印工具已加载');
            console.log('💡 选择照片或视频，添加水印后导出');

        })();
    </script>
</body>
</html>
