<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印相机 - 可拖动版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        .app-title {
            text-align: center;
            padding: 10px 0 18px 0;
            font-size: 18px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 2px;
        }
        .app-title span {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 400;
            display: block;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px dashed rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .upload-btn .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .upload-btn .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .preview-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .preview-section .placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
            line-height: 1.8;
        }
        .preview-section .placeholder .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .media-container {
            display: none;
            position: relative;
            width: 100%;
            min-height: 400px;
        }
        .media-container.active {
            display: block;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #111;
        }

        /* ================================================================
           ★★★ 可拖动水印系统 ★★★
           ================================================================ */
        .watermark-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        /* ---------- 可拖动元素基类 ---------- */
        .draggable-item {
            position: absolute;
            pointer-events: auto;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s;
            border-radius: 6px;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item .resize-handle {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
            pointer-events: auto;
        }
        .draggable-item:hover .resize-handle {
            display: block;
        }
        .draggable-item .drag-border {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: none;
            pointer-events: none;
        }
        .draggable-item:hover .drag-border {
            display: block;
        }

        /* ---------- 主水印卡片 ---------- */
        .watermark-card {
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            width: 100%;
            height: 100%;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
        }

        .wm-header {
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            padding: 5px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
        }
        .wm-header .wm-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .wm-header .wm-badge {
            color: rgba(255, 255, 255, 0.65);
            font-size: 9px;
            background: rgba(255, 255, 255, 0.12);
            padding: 1px 12px;
            border-radius: 10px;
            letter-spacing: 0.3px;
        }

        .wm-body {
            padding: 8px 14px 6px 14px;
            background: #ffffff;
        }

        .wm-line {
            font-size: 12px;
            line-height: 1.7;
            color: #1a1a1a;
            letter-spacing: 0.2px;
            font-weight: 400;
            white-space: nowrap;
        }
        .wm-line .wm-label {
            color: #555555;
            font-weight: 400;
        }
        .wm-line .wm-value {
            color: #1a1a1a;
            font-weight: 400;
        }
        .wm-high-temp {
            color: #e53935;
            font-weight: 500;
        }
        .wm-location-text {
            color: #1a1a1a;
        }
        .wm-location-text .wm-arrow {
            color: #bbbbbb;
            font-size: 10px;
            margin-left: 2px;
        }

        /* ---------- 防伪标签（独立可拖动） ---------- */
        .anti-tag {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 6px 12px 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 100px;
        }

        .anti-tag .anti-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.4;
        }

        .anti-tag .anti-brand {
            color: #ffffff;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .anti-tag .anti-sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 8px;
            letter-spacing: 0.2px;
        }

        .anti-tag .anti-code {
            color: rgba(255, 255, 255, 0.3);
            font-size: 8px;
            font-family: 'Courier New', 'Monaco', monospace;
            letter-spacing: 0.2px;
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 8px;
            border-radius: 3px;
        }

        /* ---------- 样式切换（底部控制） ---------- */
        .edit-area {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .edit-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .edit-row:last-child {
            margin-bottom: 0;
        }

        .edit-row label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            min-width: 44px;
        }

        .edit-row input,
        .edit-row select {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            min-width: 80px;
        }
        .edit-row input:focus,
        .edit-row select:focus {
            outline: none;
            border-color: #2a7ee8;
        }
        .edit-row input[type="number"] {
            max-width: 56px;
            min-width: 48px;
        }
        .edit-row .unit {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }
        .edit-row .temp-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .suggestions {
            background: #222;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin: -4px 0 8px 0;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .suggestions.active {
            display: block;
        }
        .suggestions .item {
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: #ddd;
        }
        .suggestions .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .suggestions .item .addr {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }

        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .style-btn {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .style-btn.active {
            background: #2a7ee8;
            border-color: #2a7ee8;
            color: #fff;
        }
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .anti-switch {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            background: rgba(255, 215, 0, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .anti-switch label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .anti-switch input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2a7ee8;
            cursor: pointer;
        }

        .export-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .export-btn:hover {
            transform: scale(1.01);
            opacity: 0.92;
        }
        .export-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #2a7ee8, #64b5f6);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .file-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 10px 0 4px 0;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-16px);
            }
        }

        .hidden-input {
            display: none;
        }

        /* 控制提示 */
        .drag-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 9px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 5;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 10px;
            display: none;
        }
        .media-container.active .drag-hint {
            display: block;
        }

        @media (max-width: 400px) {
            .wm-line {
                font-size: 10px;
            }
            .wm-header .wm-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="app-title">
            📷 今日水印相机
            <span>拖拽 · 缩放 · 自由布局</span>
        </div>

        <div class="upload-area">
            <div class="upload-btn" id="uploadImageBtn">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" id="uploadVideoBtn">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" class="hidden-input" accept="image/*">
            <input type="file" id="videoInput" class="hidden-input" accept="video/*">
        </div>

        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                <span class="big-icon">📸</span>
                选择照片或视频<br>
                <span style="font-size:11px;color:rgba(255,255,255,0.1);">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div class="media-container" id="mediaContainer">
                <img id="previewImage" style="display:none;width:100%;max-height:500px;object-fit:contain;background:#111;">
                <video id="previewVideo" style="display:none;width:100%;max-height:500px;object-fit:contain;background:#111;" controls></video>
                <!-- 水印图层 -->
                <div class="watermark-layer" id="watermarkLayer"></div>
                <div class="drag-hint" id="dragHint">↕ 拖拽移动 · 右下角缩放</div>
            </div>
        </div>

        <div class="style-selector">
            <button class="style-btn active" data-style="white">白底蓝条</button>
            <button class="style-btn" data-style="dark">黑底透明</button>
            <button class="style-btn" data-style="simple">简洁白字</button>
        </div>

        <div class="edit-area">
            <div class="edit-row">
                <label>📅 日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="edit-row">
                <label>⏰ 时间</label>
                <input type="time" id="editTime">
            </div>
            <div class="edit-row">
                <label>🌤️ 天气</label>
                <select id="editWeather" style="flex:0.8;">
                    <option value="晴">晴</option>
                    <option value="多云">多云</option>
                    <option value="阴">阴</option>
                    <option value="小雨">小雨</option>
                    <option value="大雨">大雨</option>
                    <option value="雪">雪</option>
                    <option value="雾">雾</option>
                </select>
                <div class="temp-group">
                    <input type="number" id="editTemp" value="35" min="-20" max="50" style="max-width:50px;">
                    <span class="unit">°C</span>
                </div>
            </div>
            <div class="edit-row" style="position:relative;flex-wrap:wrap;">
                <label>📍 地点</label>
                <input type="text" id="editLocation" placeholder="输入地点" value="成都市双流区·芝麻公园" style="flex:2;min-width:120px;">
            </div>
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标题</label>
                <input type="text" id="editTitle" value="工程记录" style="flex:1;">
            </div>
        </div>

        <div class="anti-switch">
            <label>
                <input type="checkbox" id="showAntiTag" checked>
                🏷️ 显示防伪标签
            </label>
            <label>
                <input type="checkbox" id="showMainCard" checked>
                📋 显示主水印
            </label>
            <label style="margin-left:auto;color:rgba(255,255,255,0.15);font-size:10px;">
                拖拽·缩放
            </label>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <button class="export-btn" id="exportBtn">💾 导出带水印的文件</button>

        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM
            // ============================================================
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const imageInput = document.getElementById('imageInput');
            const videoInput = document.getElementById('videoInput');
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const mediaContainer = document.getElementById('mediaContainer');
            const placeholder = document.getElementById('placeholder');
            const watermarkLayer = document.getElementById('watermarkLayer');
            const dragHint = document.getElementById('dragHint');
            const editDate = document.getElementById('editDate');
            const editTime = document.getElementById('editTime');
            const editWeather = document.getElementById('editWeather');
            const editTemp = document.getElementById('editTemp');
            const editLocation = document.getElementById('editLocation');
            const editTitle = document.getElementById('editTitle');
            const suggestions = document.getElementById('suggestions');
            const showAntiTag = document.getElementById('showAntiTag');
            const showMainCard = document.getElementById('showMainCard');
            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const fileInfo = document.getElementById('fileInfo');
            const toast = document.getElementById('toast');

            // ============================================================
            // 状态
            // ============================================================
            let currentStyle = 'white';
            let currentFile = null;
            let isVideo = false;
            let mediaUrl = null;
            let antiCode = generateAntiCode();

            // 可拖动元素状态
            let mainCardState = { x: 30, y: 50, w: 240, h: 100 };
            let antiTagState = { x: 200, y: 180, w: 160, h: 50 };

            // ============================================================
            // 防伪码
            // ============================================================
            function generateAntiCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'DKCE';
                for (let i = 0; i < 11; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            }

            // ============================================================
            // 位置数据
            // ============================================================
            const mockLocations = [
                { name: '芝麻公园', addr: '成都市双流区·芝麻公园' },
                { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
                { name: '天府广场', addr: '成都市青羊区·人民南路' },
                { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
                { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
                { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
                { name: '人民公园', addr: '成都市青羊区·祠堂街' },
                { name: '环球中心', addr: '成都市高新区·天府大道' },
                { name: '双流国际机场', addr: '成都市双流区·机场路' },
                { name: '太古里', addr: '成都市锦江区·中纱帽街' },
                { name: '九眼桥', addr: '成都市锦江区·九眼桥' },
                { name: '妙中小区', addr: '张家港市·杨舍镇' },
                { name: '张家港站', addr: '张家港市·塘桥镇' },
            ];

            // ============================================================
            // Toast
            // ============================================================
            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            }

            // ============================================================
            // 初始化
            // ============================================================
            function initDateTime() {
                const now = new Date();
                const d = now.toISOString().split('T')[0];
                const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                editDate.value = d;
                editTime.value = t;
            }
            initDateTime();

            // ============================================================
            // 上传
            // ============================================================
            uploadImageBtn.addEventListener('click', function(e) {
                e.preventDefault();
                imageInput.click();
            });

            uploadVideoBtn.addEventListener('click', function(e) {
                e.preventDefault();
                videoInput.click();
            });

            imageInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], false);
                }
                this.value = '';
            });

            videoInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], true);
                }
                this.value = '';
            });

            function loadFile(file, video) {
                isVideo = video;
                currentFile = file;
                const url = URL.createObjectURL(file);
                mediaUrl = url;

                placeholder.style.display = 'none';
                mediaContainer.classList.add('active');

                if (video) {
                    previewImage.style.display = 'none';
                    previewVideo.style.display = 'block';
                    previewVideo.src = url;
                    previewVideo.load();
                } else {
                    previewVideo.style.display = 'none';
                    previewImage.style.display = 'block';
                    previewImage.src = url;

                fileInfo.textContent = '📁 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';

                showToast('✅ 已加载' + (video ? '视频' : '照片'));
            }

            // ============================================================

            function renderWatermarks() {

                if (showAntiTag.checked) {
                    antiCode = generateAntiCode();
                }

                // ---- 构建主水印HTML ----
                const mainHTML = buildMainCardHTML(title, formattedDate, time, weather, temp, location);

                // ---- 构建防伪标签HTML ----
                const antiHTML = buildAntiTagHTML(antiCode);

                // ---- 组装 ----
                const showMain = showMainCard.checked;
                const showAnti = showAntiTag.checked;

                // 应用缩放
                const ms = mainCardState;
                const as = antiTagState;

                let html = '';

                if (showMain) {
                    html += `
                        <div class="draggable-item" id="mainCard" 
                             style="left:${ms.x * scale}px; top:${ms.y * scale}px; width:${ms.w * scale}px; height:${ms.h * scale}px;"
                             data-x="${ms.x}" data-y="${ms.y}" data-w="${ms.w}" data-h="${ms.h}">

                if (showAnti) {

                layer.innerHTML = html;

                // 重新绑定拖动事件
                setTimeout(() => {

                        mainCardState.x = x;
                        mainCardState.y = y;
                        mainCardState.w = w;
                        mainCardState.h = h;
                    });
                    initDraggable('antiTag', 'antiResize', (x, y, w, h) => {
                        antiTagState.x = x;
                        antiTagState.y = y;
                        antiTagState.w = w;
                        antiTagState.h = h;
                    });
                }, 50);
            }

            // ============================================================
            // ★★★ 拖动+缩放系统 ★★★
            // ============================================================
            function initDraggable(elementId, resizeHandleId, onUpdate) {
                const el = document.getElementById(elementId);
                if (!el) return;

                const container = mediaContainer;
                let isDragging = false;
                let isResizing = false;
                let startX, startY, startW, startH, startMX, startMY;

                // 拖动
                el.addEventListener('mousedown', function(e) {
                    if (e.target.closest('.resize-handle')) return;
                    isDragging = true;
                    const rect = container.getBoundingClientRect();
                    startX = e.clientX;
                    startY = e.clientY;
                    const scale = rect.width / 420 || 1;
                    const x = parseFloat(el.dataset.x) || 0;
                    const y = parseFloat(el.dataset.y) || 0;
                    startMX = x;
                    startMY = y;
                    el.style.cursor = 'grabbing';
                    e.preventDefault();
                });

                // 缩放
                const resizeHandle = document.getElementById(resizeHandleId);
                if (resizeHandle) {
                    resizeHandle.addEventListener('mousedown', function(e) {
                        e.stopPropagation();
                        isResizing = true;
                        const rect = container.getBoundingClientRect();
                        startX = e.clientX;
                        startY = e.clientY;
                        const scale = rect.width / 420 || 1;
                        startW = parseFloat(el.dataset.w) || 200;
                        startH = parseFloat(el.dataset.h) || 100;
                        el.style.cursor = 'nwse-resize';
                        e.preventDefault();
                    });
                }

                // 移动/缩放
                document.addEventListener('mousemove', function(e) {
                    const rect = container.getBoundingClientRect();
                    const scale = rect.width / 420 || 1;

                    if (isDragging) {
                        const dx = (e.clientX - startX) / scale;
                        const dy = (e.clientY - startY) / scale;
                        const newX = Math.max(0, startMX + dx);
                        const newY = Math.max(0, startMY + dy);
                        el.dataset.x = newX;
                        el.dataset.y = newY;
                        el.style.left = (newX * scale) + 'px';
                        el.style.top = (newY * scale) + 'px';
                        if (onUpdate) onUpdate(newX, newY, parseFloat(el.dataset.w), parseFloat(el.dataset.h));
                    }

                    if (isResizing) {
                        const dw = (e.clientX - startX) / scale;
                        const dh = (e.clientY - startY) / scale;
                        const newW = Math.max(80, startW + dw);
                        const newH = Math.max(50, startH + dh);
                        el.dataset.w = newW;
                        el.dataset.h = newH;
                        el.style.width = (newW * scale) + 'px';
                        el.style.height = (newH * scale) + 'px';
                        if (onUpdate) onUpdate(parseFloat(el.dataset.x), parseFloat(el.dataset.y), newW, newH);
                    }
                });

                document.addEventListener('mouseup', function() {
                    if (isDragging) {
                        isDragging = false;
                        el.style.cursor = 'grab';
                    }
                    if (isResizing) {
                        isResizing = false;
                        el.style.cursor = 'default';
                    }
                });

                // 触摸支持
                let touchStartX, touchStartY, touchStartW, touchStartH, touchStartMX, touchStartMY;
                let touchDist = 0;

                el.addEventListener('touchstart', function(e) {
                    const touches = e.touches;
                    if (touches.length === 1 && !e.target.closest('.resize-handle')) {
                        isDragging = true;
                        const rect = container.getBoundingClientRect();
                        const scale = rect.width / 420 || 1;
                        touchStartX = touches[0].clientX;
                        touchStartY = touches[0].clientY;
                        touchStartMX = parseFloat(el.dataset.x) || 0;
                        touchStartMY = parseFloat(el.dataset.y) || 0;
                        e.preventDefault();
                    } else if (touches.length === 2) {
                        // 双指缩放
                        isResizing = true;
                        const rect = container.getBoundingClientRect();
                        const scale = rect.width / 420 || 1;
                        touchStartW = parseFloat(el.dataset.w) || 200;
                        touchStartH = parseFloat(el.dataset.h) || 100;
                        touchDist = Math.hypot(touches[0].clientX - touches[1].clientX,
                            touches[0].clientY - touches[1].clientY);
                        e.preventDefault();
                    }
                });

                el.addEventListener('touchmove', function(e) {
                    const rect = container.getBoundingClientRect();
                    const scale = rect.width / 420 || 1;
                    const touches = e.touches;

                    if (isDragging && touches.length === 1) {
                        const dx = (touches[0].clientX - touchStartX) / scale;
                        const dy = (touches[0].clientY - touchStartY) / scale;
                        const newX = Math.max(0, touchStartMX + dx);
                        const newY = Math.max(0, touchStartMY + dy);
                        el.dataset.x = newX;
                        el.dataset.y = newY;
                        el.style.left = (newX * scale) + 'px';
                        el.style.top = (newY * scale) + 'px';
                        if (onUpdate) onUpdate(newX, newY, parseFloat(el.dataset.w), parseFloat(el.dataset.h));
                        e.preventDefault();
                    }

                    if (isResizing && touches.length === 2) {
                        const newDist = Math.hypot(touches[0].clientX - touches[1].clientX,
                            touches[0].clientY - touches[1].clientY);
                        const ratio = newDist / touchDist;
                        const newW = Math.max(80, touchStartW * ratio);
                        const newH = Math.max(50, touchStartH * ratio);
                        el.dataset.w = newW;
                        el.dataset.h = newH;
                        el.style.width = (newW * scale) + 'px';
                        el.style.height = (newH * scale) + 'px';
                        if (onUpdate) onUpdate(parseFloat(el.dataset.x), parseFloat(el.dataset.y), newW, newH);
                        e.preventDefault();
                    }
                });

                el.addEventListener('touchend', function() {
                    isDragging = false;
                    isResizing = false;
                });
            }

            // ============================================================
            // Canvas导出
            // ============================================================
            function drawWatermarksOnCanvas(ctx, w, h) {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '15:12';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '35';
                const location = editLocation.value || '成都市双流区·芝麻公园';
                const title = editTitle.value || '工程记录';
                const showAnti = showAntiTag.checked;
                const showMain = showMainCard.checked;

                const dateParts = date.split('-');
                const formattedDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];
                const code = showAnti ? generateAntiCode() : '';

                const scale = Math.min(w, h) / 800;

                // 主水印
                if (showMain) {
                    const ms = mainCardState;
                    const cx = ms.x * (w / 420);
                    const cy = ms.y * (h / 700);
                    const cw = ms.w * (w / 420);
                    const ch = ms.h * (h / 700);

                    drawMainCard(ctx, cx, cy, cw, ch, title, formattedDate, time, weather, temp, location, scale);
                }

                // 防伪标签
                if (showAnti) {
                    const as = antiTagState;
                    const ax = as.x * (w / 420);
                    const ay = as.y * (h / 700);
                    const aw = as.w * (w / 420);
                    const ah = as.h * (h / 700);

                    drawAntiTag(ctx, ax, ay, aw, ah, code, scale);
                }
            }

            function drawMainCard(ctx, x, y, w, h, title, date, time, weather, temp, location, scale) {
                const r = 6 * scale;
                const pad = 10 * scale;

                // 白底
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 16 * scale;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, r);
                ctx.fill();
                ctx.shadowBlur = 0;

                let cy = y;

                // 蓝条
                const barH = 24 * scale;
                const grad = ctx.createLinearGradient(x, cy, x, cy + barH);
                grad.addColorStop(0, '#1a6bc4');
                grad.addColorStop(1, '#2a7ee8');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(x, cy, w, barH, r);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (11 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(title, x + pad, cy + barH / 2);

                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = (7 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('水印', x + w - pad, cy + barH / 2);

                cy += barH + 4 * scale;

                // 内容
                const lineH = 18 * scale;
                const labelX = x + pad;
                const valX = x + pad + 50 * scale;

                ctx.fillStyle = '#555555';
                ctx.font = (10 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('拍摄时间：', labelX, cy + lineH / 2);
                ctx.fillStyle = '#1a1a1a';
                ctx.fillText(date + ' ' + time, valX, cy + lineH / 2);
                cy += lineH;

                ctx.fillStyle = '#555555';
                ctx.font = (10 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText('天气：', labelX, cy + lineH / 2);
                ctx.fillStyle = '#1a1a1a';
                ctx.fillText(weather + ' 高温 ', valX, cy + lineH / 2);
                ctx.fillStyle = '#e53935';
                ctx.fillText(temp + '°C', valX + ctx.measureText(weather + ' 高温 ').width, cy + lineH / 2);
                cy += lineH;

                ctx.fillStyle = '#555555';
                ctx.font = (10 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText('地点：', labelX, cy + lineH / 2);
                ctx.fillStyle = '#1a1a1a';
                ctx.fillText(location, valX, cy + lineH / 2);
            }

            function drawAntiTag(ctx, x, y, w, h, code, scale) {
                const pad = 10 * scale;

                // 背景
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12 * scale;
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 6 * scale);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 6 * scale);
                ctx.stroke();

                const cy = y + h / 2;

                // 第一行：今日水印 + 防伪码
                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (10 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('今日水印', x + pad, cy - 6 * scale);

                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.font = (7 * scale) + 'px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(code, x + w - pad, cy - 6 * scale);

                // 第二行：相机真实可验
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = (7 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('相机真实可验', x + pad, cy + 8 * scale);
            }

            // roundRect polyfill
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            // ============================================================
            // 导出
            // ============================================================
            exportBtn.addEventListener('click', function() {
                if (!currentFile) {
                    showToast('⚠️ 请先选择照片或视频');
                    return;
                }
                if (isVideo) {
                    exportVideo();
                } else {

            function exportImage() {
                const img = previewImage;
                if (!img.src || img.style.display === 'none') {
                    showToast('⚠️ 没有图片可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    ctx.drawImage(imgObj, 0, 0);
                    drawWatermarksOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1000);
                };
                imgObj.onerror = function() {
                    showToast('❌ 图片加载失败');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    progressBar.classList.remove('active');
                };
                imgObj.src = img.src;
            }

            function exportVideo() {
                const video = previewVideo;
                if (!video.src || video.style.display === 'none') {
                    showToast('⚠️ 没有视频可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermarksOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印视频帧_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 视频帧导出成功！');
                } catch (e) {
                    showToast('❌ 导出失败: ' + e.message);
                }

                exportBtn.disabled = false;
                exportBtn.textContent = '💾 导出带水印的文件';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
            }

            // ============================================================
            // 窗口变化重新渲染
            // ============================================================
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderWatermarks, 200);
            });

            // ============================================================
            // 初始渲染
            // ============================================================
            renderWatermarks();

            console.log('📷 今日水印相机 - 可拖动版');
            console.log('💡 拖拽移动 · 右下角缩放 · 双指缩放');

        })();
    </script>
</body>
</html>
