
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印相机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        /* ================================================
           标题
           ================================================ */
        .app-title {
            text-align: center;
            padding: 12px 0 20px 0;
            font-size: 18px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 2px;
        }
        .app-title span {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            font-weight: 400;
            display: block;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ================================================
           上传区域
           ================================================ */
        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .upload-btn {
            background: rgba(255,255,255,0.04);
            border: 1.5px dashed rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .upload-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
        }
        .upload-btn .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .upload-btn .label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }

        /* ================================================
           预览区 - 这里显示水印效果
           ================================================ */
        .preview-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .preview-section .placeholder {
            color: rgba(255,255,255,0.15);
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
            line-height: 1.8;
        }
        .preview-section .placeholder .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .media-container {
            display: none;
            position: relative;
            width: 100%;
        }
        .media-container.active {
            display: block;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            display: block;
            background: #111;
        }

        /* ================================================
           ★★★ 核心：水印样式 - 完全还原今日水印 ★★★
           ================================================ */
        .watermark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* ---------- 水印卡片 ---------- */
        .watermark-card {
            position: absolute;
            bottom: 16px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
        }

        /* ----- 顶部蓝条 ----- */
        .watermark-header {
            background: linear-gradient(135deg, #1a6bc4, #2980e6);
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 32px;
        }
        .watermark-header .title {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .watermark-header .badge {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            background: rgba(255, 255, 255, 0.15);
            padding: 1px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        /* ----- 内容区 ----- */
        .watermark-body {
            padding: 10px 14px 8px 14px;
        }

        .watermark-row {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }
        .watermark-row:last-child {
            margin-bottom: 0;
        }

        .watermark-row .label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            min-width: 56px;
            letter-spacing: 0.5px;
        }
        .watermark-row .value {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .watermark-row .value-light {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 400;
        }

        /* 天气特殊样式 */
        .weather-temp {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .weather-temp .temp-icon {
            font-size: 14px;
        }
        .weather-temp .temp-val {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }
        .weather-temp .temp-unit {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }

        /* 地点 - 带小箭头 */
        .location-value {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
        }
        .location-value .arrow {
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
        }

        /* ----- 底部防伪 ----- */
        .watermark-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 14px 8px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 2px;
        }

        .watermark-footer .brand-left {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .watermark-footer .brand-name {
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .watermark-footer .brand-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 9px;
            letter-spacing: 0.3px;
        }

        .watermark-footer .anti-code {
            color: rgba(255, 255, 255, 0.25);
            font-size: 9px;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 8px;
            border-radius: 3px;
        }

        /* 防伪码生成规则：时间戳 + 随机字符 */
        .watermark-footer .anti-code .highlight {
            color: rgba(255, 215, 0, 0.3);
        }

        /* ================================================
           编辑区
           ================================================ */
        .edit-area {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .edit-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .edit-row:last-child {
            margin-bottom: 0;
        }

        .edit-row label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            min-width: 44px;
        }

        .edit-row input,
        .edit-row select {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            min-width: 80px;
        }
        .edit-row input:focus,
        .edit-row select:focus {
            outline: none;
            border-color: #2980e6;
        }
        .edit-row input[type="number"] {
            max-width: 60px;
            min-width: 50px;
        }
        .edit-row .unit {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
        }

        .edit-row .temp-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        /* 位置联想 */
        .suggestions {
            background: #222;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin: -4px 0 8px 0;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .suggestions.active {
            display: block;
        }
        .suggestions .item {
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: #ddd;
        }
        .suggestions .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .suggestions .item .addr {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }

        /* ================================================
           样式切换
           ================================================ */
        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .style-btn {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .style-btn.active {
            background: #2980e6;
            border-color: #2980e6;
            color: #fff;
        }
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ================================================
           防伪开关
           ================================================ */
        .anti-switch {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            background: rgba(255, 215, 0, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .anti-switch label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .anti-switch input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2980e6;
            cursor: pointer;
        }

        /* ================================================
           导出按钮
           ================================================ */
        .export-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a6bc4, #2980e6);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .export-btn:hover {
            transform: scale(1.01);
            opacity: 0.92;
        }
        .export-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #2980e6, #64b5f6);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .file-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 10px 0 4px 0;
        }

        /* ================================================
           Toast
           ================================================ */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-16px);
            }
        }

        .hidden-input {
            display: none;
        }

        /* ================================================
           响应式
           ================================================ */
        @media (max-width: 400px) {
            .watermark-row .label {
                min-width: 44px;
                font-size: 10px;
            }
            .watermark-row .value {
                font-size: 12px;
            }
            .watermark-header .title {
                font-size: 12px;
            }
            .watermark-footer .brand-name {
                font-size: 11px;
            }
            .watermark-footer .anti-code {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 标题 -->
        <div class="app-title">
            📷 今日水印相机
            <span>选择照片或视频 · 添加专业水印</span>
        </div>

        <!-- 上传 -->
        <div class="upload-area">
            <div class="upload-btn" id="uploadImageBtn">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" id="uploadVideoBtn">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" class="hidden-input" accept="image/*">
            <input type="file" id="videoInput" class="hidden-input" accept="video/*">
        </div>

        <!-- 预览 -->
        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                <span class="big-icon">📸</span>
                选择照片或视频<br>
                <span style="font-size:11px;color:rgba(255,255,255,0.1);">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div class="media-container" id="mediaContainer">
                <img id="previewImage" style="display:none;width:100%;max-height:480px;object-fit:contain;background:#111;">
                <video id="previewVideo" style="display:none;width:100%;max-height:480px;object-fit:contain;background:#111;" controls></video>
                <!-- 水印覆盖层 -->
                <div class="watermark-overlay" id="watermarkOverlay"></div>
            </div>
        </div>

        <!-- 样式切换 -->
        <div class="style-selector">
            <button class="style-btn active" data-style="standard">标准蓝条</button>
            <button class="style-btn" data-style="classic">经典黑底</button>
            <button class="style-btn" data-style="simple">简洁白字</button>
        </div>

        <!-- 编辑 -->
        <div class="edit-area">
            <div class="edit-row">
                <label>📅 日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="edit-row">
                <label>⏰ 时间</label>
                <input type="time" id="editTime">
            </div>
            <div class="edit-row">
                <label>🌤️ 天气</label>
                <select id="editWeather" style="flex:0.8;">
                    <option value="晴">☀️ 晴</option>
                    <option value="多云">⛅ 多云</option>
                    <option value="阴">☁️ 阴</option>
                    <option value="小雨">🌦️ 小雨</option>
                    <option value="大雨">🌧️ 大雨</option>
                    <option value="雪">❄️ 雪</option>
                    <option value="雾">🌫️ 雾</option>
                </select>
                <div class="temp-group">
                    <input type="number" id="editTemp" value="35" min="-20" max="50" style="max-width:50px;">
                    <span class="unit">°C</span>
                </div>
            </div>
            <div class="edit-row" style="position:relative;flex-wrap:wrap;">
                <label>📍 地点</label>
                <input type="text" id="editLocation" placeholder="输入地点，自动联想" value="成都市双流区·芝麻公园" style="flex:2;min-width:120px;">
            </div>
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标题</label>
                <input type="text" id="editTitle" value="工程记录" style="flex:1;">
            </div>
        </div>

        <!-- 防伪开关 -->
        <div class="anti-switch">
            <label>
                <input type="checkbox" id="antiFake" checked>
                🛡️ 防伪标志
            </label>
            <label>
                <input type="checkbox" id="showBrand" checked>
                ℹ️ 品牌标识
            </label>
            <label style="margin-left:auto;color:rgba(255,255,255,0.2);font-size:10px;">
                防伪码自动生成
            </label>
        </div>

        <!-- 进度 -->
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- 导出 -->
        <button class="export-btn" id="exportBtn">💾 导出带水印的文件</button>

        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM
            // ============================================================
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const imageInput = document.getElementById('imageInput');
            const videoInput = document.getElementById('videoInput');
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const mediaContainer = document.getElementById('mediaContainer');
            const placeholder = document.getElementById('placeholder');
            const watermarkOverlay = document.getElementById('watermarkOverlay');
            const editDate = document.getElementById('editDate');
            const editTime = document.getElementById('editTime');
            const editWeather = document.getElementById('editWeather');
            const editTemp = document.getElementById('editTemp');
            const editLocation = document.getElementById('editLocation');
            const editTitle = document.getElementById('editTitle');
            const suggestions = document.getElementById('suggestions');
            const antiFake = document.getElementById('antiFake');
            const showBrand = document.getElementById('showBrand');
            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const fileInfo = document.getElementById('fileInfo');
            const toast = document.getElementById('toast');

            // ============================================================
            // 状态
            // ============================================================
            let currentStyle = 'standard';
            let currentFile = null;
            let isVideo = false;
            let mediaUrl = null;

            // ============================================================
            // 防伪码生成
            // ============================================================
            function generateAntiCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'DKCE';
                for (let i = 0; i < 11; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            }
            let antiCode = generateAntiCode();

            // ============================================================
            // 位置数据
            // ============================================================
            const mockLocations = [
                { name: '芝麻公园', addr: '成都市双流区·芝麻公园' },
                { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
                { name: '天府广场', addr: '成都市青羊区·人民南路' },
                { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
                { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
                { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
                { name: '人民公园', addr: '成都市青羊区·祠堂街' },
                { name: '环球中心', addr: '成都市高新区·天府大道' },
                { name: '双流国际机场', addr: '成都市双流区·机场路' },
                { name: '太古里', addr: '成都市锦江区·中纱帽街' },
                { name: '九眼桥', addr: '成都市锦江区·九眼桥' },
                { name: '妙中小区', addr: '张家港市·杨舍镇' },
                { name: '张家港站', addr: '张家港市·塘桥镇' },
                { name: '上海外滩', addr: '上海市黄浦区·中山东一路' },
                { name: '北京天安门', addr: '北京市东城区·长安街' },
                { name: '广州塔', addr: '广州市海珠区·阅江西路' },
                { name: '深圳湾', addr: '深圳市南山区·滨海大道' },
            ];

            // ============================================================
            // Toast
            // ============================================================
            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ============================================================
            // 初始化
            // ============================================================
            function initDateTime() {
                const now = new Date();
                const d = now.toISOString().split('T')[0];
                const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                editDate.value = d;
                editTime.value = t;
            }
            initDateTime();

            // ============================================================
            // 上传
            // ============================================================
            uploadImageBtn.addEventListener('click', function(e) {
                e.preventDefault();
                imageInput.click();
            });

            uploadVideoBtn.addEventListener('click', function(e) {
                e.preventDefault();
                videoInput.click();
            });

            imageInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], false);
                }
                this.value = '';
            });

            videoInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], true);
                }
                this.value = '';
            });

            function loadFile(file, video) {
                isVideo = video;
                currentFile = file;
                const url = URL.createObjectURL(file);
                mediaUrl = url;

                placeholder.style.display = 'none';
                mediaContainer.classList.add('active');

                if (video) {
                    previewImage.style.display = 'none';
                    previewVideo.style.display = 'block';
                    previewVideo.src = url;
                    previewVideo.load();
                } else {
                    previewVideo.style.display = 'none';
                    previewImage.style.display = 'block';
                    previewImage.src = url;
                }

                fileInfo.textContent = '📁 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                updateWatermark();
                showToast('✅ 已加载' + (video ? '视频' : '照片'));
            }

            // ============================================================
            // ★★★ 核心：水印渲染 - 完全还原今日水印 ★★★
            // ============================================================
            function updateWatermark() {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '15:12';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '35';
                const location = editLocation.value || '成都市双流区·芝麻公园';
                const title = editTitle.value || '工程记录';
                const showAnti = antiFake.checked;
                const showBrandFlag = showBrand.checked;

                // 格式化日期：2026.08.05
                const dateParts = date.split('-');
                const formattedDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];

                // 生成防伪码（每次更新时重新生成，保持随机）
                if (showAnti) {
                    antiCode = generateAntiCode();
                }

                let html = '';

                // ============================================================
                // 样式1：标准蓝条版（与今日水印完全一致）
                // ============================================================
                if (currentStyle === 'standard') {
                    html = `
                        <div class="watermark-card">
                            <!-- 顶部蓝条 -->
                            <div class="watermark-header">
                                <span class="title">${title}</span>
                                <span class="badge">水印</span>
                            </div>
                            <!-- 内容 -->
                            <div class="watermark-body">
                                <div class="watermark-row">
                                    <span class="label">拍摄时间</span>
                                    <span class="value">${formattedDate} ${time}</span>
                                </div>
                                <div class="watermark-row">
                                    <span class="label">天气</span>
                                    <span class="value">
                                        <span class="weather-temp">
                                            <span class="temp-icon">${weather === '晴' ? '☀️' : weather === '多云' ? '⛅' : weather === '阴' ? '☁️' : weather === '小雨' ? '🌦️' : weather === '大雨' ? '🌧️' : weather === '雪' ? '❄️' : '🌫️'}</span>
                                            <span class="temp-val">${weather}</span>
                                            <span class="temp-unit">高温 ${temp}°C</span>
                                        </span>
                                    </span>
                                </div>
                                <div class="watermark-row" style="margin-bottom:0;">
                                    <span class="label">地点</span>
                                    <span class="value location-value">
                                        📍 ${location}
                                        <span class="arrow">▸</span>
                                    </span>
                                </div>
                            </div>
                            <!-- 底部防伪 -->
                            <div class="watermark-footer">
                                <div class="brand-left">
                                    <span class="brand-name">今日水印</span>
                                    <span class="brand-sub">相机真实可验</span>
                                </div>
                                ${showAnti ? `<span class="anti-code">防伪 <span class="highlight">${antiCode}</span></span>` : ''}
                                ${!showAnti && showBrandFlag ? `<span class="anti-code" style="color:rgba(255,255,255,0.15);">今日水印</span>` : ''}
                            </div>
                        </div>
                    `;
                }

                // ============================================================
                // 样式2：经典黑底版
                // ============================================================
                else if (currentStyle === 'classic') {
                    html = `
                        <div class="watermark-card" style="background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.05);">
                            <div class="watermark-body" style="padding:12px 14px;">
                                <div class="watermark-row">
                                    <span class="label" style="color:rgba(255,255,255,0.4);">📷</span>
                                    <span class="value" style="font-size:15px;font-weight:600;color:#FFD700;">${title}</span>
                                </div>
                                <div class="watermark-row">
                                    <span class="label" style="color:rgba(255,255,255,0.4);">时间</span>
                                    <span class="value">${formattedDate} ${time}</span>
                                </div>
                                <div class="watermark-row">
                                    <span class="label" style="color:rgba(255,255,255,0.4);">天气</span>
                                    <span class="value">${weather} ${temp}°C</span>
                                </div>
                                <div class="watermark-row" style="margin-bottom:0;">
                                    <span class="label" style="color:rgba(255,255,255,0.4);">地点</span>
                                    <span class="value">📍 ${location}</span>
                                </div>
                            </div>
                            ${showAnti ? `
                            <div class="watermark-footer" style="border-top-color:rgba(255,255,255,0.05);">
                                <span class="brand-name" style="font-size:11px;color:rgba(255,255,255,0.3);">今日水印 · 真实可验</span>
                                <span class="anti-code" style="color:rgba(255,255,255,0.15);">${antiCode}</span>
                            </div>` : ''}
                        </div>
                    `;
                }

                // ============================================================
                // 样式3：简洁白字版
                // ============================================================
                else if (currentStyle === 'simple') {
                    html = `
                        <div class="watermark-card" style="background:rgba(0,0,0,0.35);backdrop-filter:blur(4px);border:none;box-shadow:none;">
                            <div class="watermark-body" style="padding:10px 14px;">
                                <div style="font-size:22px;font-weight:300;color:#fff;letter-spacing:1px;">${formattedDate}</div>
                                <div style="font-size:28px;font-weight:200;color:#fff;margin:-2px 0 4px 0;">${time}</div>
                                <div style="display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,0.8);">
                                    <span>${weather} ${temp}°C</span>
                                    <span>📍 ${location}</span>
                                </div>
                            </div>
                            ${showAnti ? `
                            <div class="watermark-footer" style="border-top:none;padding-top:0;justify-content:flex-end;">
                                <span style="color:rgba(255,255,255,0.2);font-size:10px;">今日水印 · 真实可验</span>
                            </div>` : ''}
                        </div>
                    `;
                }

                watermarkOverlay.innerHTML = html;
            }

            // ============================================================
            // 样式切换
            // ============================================================
            document.querySelectorAll('.style-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStyle = this.dataset.style;
                    updateWatermark();
                });
            });

            // ============================================================
            // 编辑事件
            // ============================================================
            editDate.addEventListener('change', updateWatermark);
            editTime.addEventListener('change', updateWatermark);
            editWeather.addEventListener('change', updateWatermark);
            editTemp.addEventListener('change', updateWatermark);
            editTitle.addEventListener('input', updateWatermark);
            antiFake.addEventListener('change', updateWatermark);
            showBrand.addEventListener('change', updateWatermark);

            // ============================================================
            // 位置联想
            // ============================================================
            editLocation.addEventListener('input', function() {
                const value = this.value;
                if (value.length < 2) {
                    suggestions.classList.remove('active');
                    return;
                }

                const results = mockLocations.filter(function(item) {
                    return item.name.includes(value) || item.addr.includes(value);
                });

                if (results.length === 0) {
                    suggestions.innerHTML =
                        `<div class="item" onclick="window.selectLocation('${value}')">📌 使用 "${value}"</div>`;
                } else {
                    suggestions.innerHTML = results.map(function(item) {
                        return `
                            <div class="item" onclick="window.selectLocation('${item.addr}')">
                                📍 ${item.name}
                                <div class="addr">${item.addr}</div>
                            </div>
                        `;
                    }).join('');
                }
                suggestions.classList.add('active');
            });

            editLocation.addEventListener('blur', function() {
                setTimeout(() => suggestions.classList.remove('active'), 300);
            });

            editLocation.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const first = suggestions.querySelector('.item');
                    if (first) first.click();
                    suggestions.classList.remove('active');
                }
            });

            window.selectLocation = function(loc) {
                editLocation.value = loc;
                suggestions.classList.remove('active');
                updateWatermark();
                showToast('📍 位置已更新');
            };

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.edit-area')) {
                    suggestions.classList.remove('active');
                }
            });

            // ============================================================
            // Canvas绘制 - 导出时使用
            // ============================================================
            function drawWatermarkOnCanvas(ctx, w, h) {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '15:12';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '35';
                const location = editLocation.value || '成都市双流区·芝麻公园';
                const title = editTitle.value || '工程记录';
                const showAnti = antiFake.checked;

                const dateParts = date.split('-');
                const formattedDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];
                const code = showAnti ? generateAntiCode() : '';

                // 根据图片尺寸缩放
                const scale = Math.min(w, h) / 800;
                const baseFont = Math.max(12, 18 * scale);
                const smallFont = Math.max(9, 13 * scale);
                const padding = Math.max(12, 20 * scale);
                const cardWidth = w - padding * 2;
                const cardHeight = 160 * scale;

                // 卡片背景
                const cardX = padding;
                const cardY = h - padding - cardHeight;

                // 半透明背景
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 8 * scale);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 边框
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardWidth, cardHeight, 8 * scale);
                ctx.stroke();

                let y = cardY;

                // ---- 顶部蓝条 ----
                const barHeight = 32 * scale;
                const grad = ctx.createLinearGradient(cardX, y, cardX, y + barHeight);
                grad.addColorStop(0, '#1a6bc4');
                grad.addColorStop(1, '#2980e6');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(cardX, y, cardWidth, barHeight, 8 * scale);
                ctx.fill();

                // 蓝条文字
                ctx.fillStyle = '#ffffff';
                ctx.font = '600 ' + (13 * scale) + 'px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(title, cardX + 14 * scale, y + barHeight / 2);

                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = (9 * scale) + 'px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('水印', cardX + cardWidth - 14 * scale, y + barHeight / 2);

                y += barHeight;

                // ---- 内容 ----
                const rowHeight = 28 * scale;
                const labelX = cardX + 14 * scale;
                const valueX = cardX + 70 * scale;
                y += 6 * scale;

                // 拍摄时间
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = (11 * scale) + 'px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('拍摄时间', labelX, y + rowHeight / 2);

                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (13 * scale) + 'px sans-serif';
                ctx.fillText(formattedDate + ' ' + time, valueX, y + rowHeight / 2);

                y += rowHeight;

                // 天气
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = (11 * scale) + 'px sans-serif';
                ctx.fillText('天气', labelX, y + rowHeight / 2);

                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (13 * scale) + 'px sans-serif';
                const weatherIcon = weather === '晴' ? '☀️' : weather === '多云' ? '⛅' : weather === '阴' ? '☁️' :
                    weather === '小雨' ? '🌦️' : weather === '大雨' ? '🌧️' : weather === '雪' ? '❄️' : '🌫️';
                ctx.fillText(weatherIcon + ' ' + weather + '  高温 ' + temp + '°C', valueX, y + rowHeight / 2);

                y += rowHeight;

                // 地点
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = (11 * scale) + 'px sans-serif';
                ctx.fillText('地点', labelX, y + rowHeight / 2);

                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (13 * scale) + 'px sans-serif';
                ctx.fillText('📍 ' + location, valueX, y + rowHeight / 2);

                y += rowHeight + 2 * scale;

                // ---- 底部防伪 ----
                const footerY = cardY + cardHeight - 28 * scale;
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cardX + 14 * scale, footerY);
                ctx.lineTo(cardX + cardWidth - 14 * scale, footerY);
                ctx.stroke();

                ctx.textBaseline = 'middle';

                if (showAnti) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '600 ' + (12 * scale) + 'px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('今日水印', cardX + 14 * scale, footerY + 14 * scale);

                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.font = (9 * scale) + 'px sans-serif';
                    ctx.fillText('相机真实可验', cardX + 14 * scale + 60 * scale, footerY + 14 * scale);

                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '500 ' + (9 * scale) + 'px monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('防伪 ' + code, cardX + cardWidth - 14 * scale, footerY + 14 * scale);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = (10 * scale) + 'px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText('今日水印', cardX + cardWidth - 14 * scale, footerY + 14 * scale);
                }
            }

            // roundRect polyfill for Canvas
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            // ============================================================
            // 导出
            // ============================================================
            exportBtn.addEventListener('click', function() {
                if (!currentFile) {
                    showToast('⚠️ 请先选择照片或视频');
                    return;
                }
                if (isVideo) {
                    exportVideo();
                } else {
                    exportImage();
                }
            });

            function exportImage() {
                const img = previewImage;
                if (!img.src || img.style.display === 'none') {
                    showToast('⚠️ 没有图片可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    ctx.drawImage(imgObj, 0, 0);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1000);
                };
                imgObj.onerror = function() {
                    showToast('❌ 图片加载失败');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    progressBar.classList.remove('active');
                };
                imgObj.src = img.src;
            }

            function exportVideo() {
                const video = previewVideo;
                if (!video.src || video.style.display === 'none') {
                    showToast('⚠️ 没有视频可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印视频帧_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 视频帧导出成功！');
                } catch (e) {
                    showToast('❌ 导出失败: ' + e.message);
                }

                exportBtn.disabled = false;
                exportBtn.textContent = '💾 导出带水印的文件';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
            }

            // ============================================================
            // 初始渲染
            // ============================================================
            updateWatermark();

            console.log('📷 今日水印相机已加载 - 完全还原版');
            console.log('💡 选择照片或视频，水印样式与App一致');

        })();
    </script>
</body>
</html>
