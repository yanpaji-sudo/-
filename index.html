<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日水印相机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        /* 标题 */
        .app-title {
            text-align: center;
            padding: 10px 0 18px 0;
            font-size: 18px;
            font-weight: 600;
            color: #FFD700;
            letter-spacing: 2px;
        }
        .app-title span {
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-weight: 400;
            display: block;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* 上传 */
        .upload-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px dashed rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 18px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .upload-btn .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }
        .upload-btn .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ========== 预览区 ========== */
        .preview-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .preview-section .placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            padding: 40px 20px;
            text-align: center;
            line-height: 1.8;
        }
        .preview-section .placeholder .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .media-container {
            display: none;
            position: relative;
            width: 100%;
        }
        .media-container.active {
            display: block;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            display: block;
            background: #111;
        }

        /* ================================================================
           ★★★ 水印 - 像素级还原今日水印 ★★★
           ================================================================ */
        .watermark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* ---------- 水印卡片：纯白背景 ---------- */
        .watermark-card {
            position: absolute;
            bottom: 16px;
            left: 12px;
            right: 12px;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
        }

        /* ----- 顶部蓝条 ----- */
        .wm-header {
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            padding: 5px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
        }
        .wm-header .wm-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .wm-header .wm-badge {
            color: rgba(255, 255, 255, 0.65);
            font-size: 9px;
            background: rgba(255, 255, 255, 0.12);
            padding: 1px 12px;
            border-radius: 10px;
            letter-spacing: 0.3px;
        }

        /* ----- 内容区：白底黑字，左对齐，连在一起 ----- */
        .wm-body {
            padding: 8px 14px 6px 14px;
            background: #ffffff;
        }

        /* 每一行：标签+值连在一起，用冒号分隔 */
        .wm-line {
            font-size: 12px;
            line-height: 1.7;
            color: #1a1a1a;
            letter-spacing: 0.2px;
            font-weight: 400;
        }

        .wm-line .wm-label {
            color: #555555;
            font-weight: 400;
        }

        .wm-line .wm-value {
            color: #1a1a1a;
            font-weight: 400;
        }

        .wm-line .wm-value-light {
            color: #555555;
            font-weight: 400;
        }

        /* 天气里的高温 */
        .wm-weather-text {
            color: #1a1a1a;
        }
        .wm-weather-text .wm-high {
            color: #555555;
        }

        /* 地点带箭头 */
        .wm-location-text {
            color: #1a1a1a;
        }
        .wm-location-text .wm-arrow {
            color: #bbbbbb;
            font-size: 10px;
            margin-left: 2px;
        }

        /* ----- 底部防伪：两行 ----- */
        .wm-footer {
            padding: 4px 14px 8px 14px;
            background: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .wm-footer .wm-brand-group {
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        .wm-footer .wm-brand-name {
            color: #1a1a1a;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .wm-footer .wm-brand-sub {
            color: #999999;
            font-size: 9px;
            letter-spacing: 0.2px;
        }

        .wm-footer .wm-anti {
            color: #bbbbbb;
            font-size: 9px;
            font-family: 'Courier New', 'Monaco', monospace;
            letter-spacing: 0.2px;
            background: #f5f5f5;
            padding: 1px 10px;
            border-radius: 3px;
            align-self: center;
        }
        .wm-footer .wm-anti .hl {
            color: #888888;
        }

        /* ---------- 黑底样式 ---------- */
        .watermark-card-dark {
            position: absolute;
            bottom: 16px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        .watermark-card-dark .wm-body {
            background: transparent;
            padding: 10px 14px 6px 14px;
        }
        .watermark-card-dark .wm-line {
            color: #ffffff;
        }
        .watermark-card-dark .wm-line .wm-label {
            color: rgba(255, 255, 255, 0.4);
        }
        .watermark-card-dark .wm-line .wm-value {
            color: #ffffff;
        }
        .watermark-card-dark .wm-line .wm-value-light {
            color: rgba(255, 255, 255, 0.5);
        }
        .watermark-card-dark .wm-weather-text .wm-high {
            color: rgba(255, 255, 255, 0.4);
        }
        .watermark-card-dark .wm-location-text {
            color: #ffffff;
        }
        .watermark-card-dark .wm-location-text .wm-arrow {
            color: rgba(255, 255, 255, 0.2);
        }
        .watermark-card-dark .wm-footer {
            background: transparent;
            border-top-color: rgba(255, 255, 255, 0.05);
        }
        .watermark-card-dark .wm-footer .wm-brand-name {
            color: rgba(255, 255, 255, 0.8);
        }
        .watermark-card-dark .wm-footer .wm-brand-sub {
            color: rgba(255, 255, 255, 0.3);
        }
        .watermark-card-dark .wm-footer .wm-anti {
            color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        .watermark-card-dark .wm-footer .wm-anti .hl {
            color: rgba(255, 215, 0, 0.2);
        }

        /* ---------- 简洁白字 ---------- */
        .watermark-card-simple {
            position: absolute;
            bottom: 16px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 6px;
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        .watermark-card-simple .wm-body {
            background: transparent;
            padding: 10px 14px 6px 14px;
        }
        .watermark-card-simple .wm-line {
            color: #ffffff;
        }
        .watermark-card-simple .wm-line .wm-label {
            color: rgba(255, 255, 255, 0.35);
        }
        .watermark-card-simple .wm-line .wm-value {
            color: #ffffff;
        }
        .watermark-card-simple .wm-line .wm-value-light {
            color: rgba(255, 255, 255, 0.5);
        }
        .watermark-card-simple .wm-footer {
            background: transparent;
            border-top-color: rgba(255, 255, 255, 0.05);
            justify-content: flex-end;
        }
        .watermark-card-simple .wm-footer .wm-brand-sub {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ================================================================
           编辑区
           ================================================================ */
        .edit-area {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .edit-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .edit-row:last-child {
            margin-bottom: 0;
        }

        .edit-row label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            min-width: 44px;
        }

        .edit-row input,
        .edit-row select {
            flex: 1;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 13px;
            min-width: 80px;
        }
        .edit-row input:focus,
        .edit-row select:focus {
            outline: none;
            border-color: #2a7ee8;
        }
        .edit-row input[type="number"] {
            max-width: 56px;
            min-width: 48px;
        }
        .edit-row .unit {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        .edit-row .temp-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .suggestions {
            background: #222;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
            margin: -4px 0 8px 0;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .suggestions.active {
            display: block;
        }
        .suggestions .item {
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: #ddd;
        }
        .suggestions .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .suggestions .item .addr {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
        }

        /* 样式切换 */
        .style-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .style-btn {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .style-btn.active {
            background: #2a7ee8;
            border-color: #2a7ee8;
            color: #fff;
        }
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* 防伪开关 */
        .anti-switch {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 14px;
            background: rgba(255, 215, 0, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .anti-switch label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .anti-switch input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2a7ee8;
            cursor: pointer;
        }

        .export-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1a6bc4, #2a7ee8);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .export-btn:hover {
            transform: scale(1.01);
            opacity: 0.92;
        }
        .export-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #2a7ee8, #64b5f6);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .file-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 10px 0 4px 0;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(16px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-16px);
            }
        }

        .hidden-input {
            display: none;
        }

        @media (max-width: 400px) {
            .wm-line {
                font-size: 11px;
            }
            .wm-header .wm-title {
                font-size: 12px;
            }
            .wm-footer .wm-brand-name {
                font-size: 11px;
            }
            .wm-footer .wm-anti {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="app-title">
            📷 今日水印相机
            <span>选择照片 · 添加专业水印</span>
        </div>

        <!-- 上传 -->
        <div class="upload-area">
            <div class="upload-btn" id="uploadImageBtn">
                <span class="icon">🖼️</span>
                <span class="label">选择照片</span>
            </div>
            <div class="upload-btn" id="uploadVideoBtn">
                <span class="icon">🎬</span>
                <span class="label">选择视频</span>
            </div>
            <input type="file" id="imageInput" class="hidden-input" accept="image/*">
            <input type="file" id="videoInput" class="hidden-input" accept="video/*">
        </div>

        <!-- 预览 -->
        <div class="preview-section" id="previewSection">
            <div class="placeholder" id="placeholder">
                <span class="big-icon">📸</span>
                选择照片或视频<br>
                <span style="font-size:11px;color:rgba(255,255,255,0.1);">支持 JPG, PNG, MP4, MOV</span>
            </div>
            <div class="media-container" id="mediaContainer">
                <img id="previewImage" style="display:none;width:100%;max-height:480px;object-fit:contain;background:#111;">
                <video id="previewVideo" style="display:none;width:100%;max-height:480px;object-fit:contain;background:#111;" controls></video>
                <div class="watermark-overlay" id="watermarkOverlay"></div>
            </div>
        </div>

        <!-- 样式切换 -->
        <div class="style-selector">
            <button class="style-btn active" data-style="white">白底蓝条</button>
            <button class="style-btn" data-style="dark">黑底透明</button>
            <button class="style-btn" data-style="simple">简洁白字</button>
        </div>

        <!-- 编辑 -->
        <div class="edit-area">
            <div class="edit-row">
                <label>📅 日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="edit-row">
                <label>⏰ 时间</label>
                <input type="time" id="editTime">
            </div>
            <div class="edit-row">
                <label>🌤️ 天气</label>
                <select id="editWeather" style="flex:0.8;">
                    <option value="晴">晴</option>
                    <option value="多云">多云</option>
                    <option value="阴">阴</option>
                    <option value="小雨">小雨</option>
                    <option value="大雨">大雨</option>
                    <option value="雪">雪</option>
                    <option value="雾">雾</option>
                </select>
                <div class="temp-group">
                    <input type="number" id="editTemp" value="35" min="-20" max="50" style="max-width:50px;">
                    <span class="unit">°C</span>
                </div>
            </div>
            <div class="edit-row" style="position:relative;flex-wrap:wrap;">
                <label>📍 地点</label>
                <input type="text" id="editLocation" placeholder="输入地点" value="成都市双流区·芝麻公园" style="flex:2;min-width:120px;">
            </div>
            <div class="suggestions" id="suggestions"></div>
            <div class="edit-row" style="margin-bottom:0;">
                <label>📝 标题</label>
                <input type="text" id="editTitle" value="工程记录" style="flex:1;">
            </div>
        </div>

        <!-- 防伪 -->
        <div class="anti-switch">
            <label>
                <input type="checkbox" id="antiFake" checked>
                🛡️ 防伪标志
            </label>
            <label>
                <input type="checkbox" id="showBrand" checked>
                ℹ️ 品牌标识
            </label>
            <label style="margin-left:auto;color:rgba(255,255,255,0.15);font-size:10px;">
                防伪码自动生成
            </label>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>

        <button class="export-btn" id="exportBtn">💾 导出带水印的文件</button>

        <div class="file-info" id="fileInfo">选择照片或视频开始制作</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM
            // ============================================================
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const imageInput = document.getElementById('imageInput');
            const videoInput = document.getElementById('videoInput');
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const mediaContainer = document.getElementById('mediaContainer');
            const placeholder = document.getElementById('placeholder');
            const watermarkOverlay = document.getElementById('watermarkOverlay');
            const editDate = document.getElementById('editDate');
            const editTime = document.getElementById('editTime');
            const editWeather = document.getElementById('editWeather');
            const editTemp = document.getElementById('editTemp');
            const editLocation = document.getElementById('editLocation');
            const editTitle = document.getElementById('editTitle');
            const suggestions = document.getElementById('suggestions');
            const antiFake = document.getElementById('antiFake');
            const showBrand = document.getElementById('showBrand');
            const exportBtn = document.getElementById('exportBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const fileInfo = document.getElementById('fileInfo');
            const toast = document.getElementById('toast');

            // ============================================================
            // 状态
            // ============================================================
            let currentStyle = 'white';
            let currentFile = null;
            let isVideo = false;
            let mediaUrl = null;

            // ============================================================
            // 防伪码
            // ============================================================
            function generateAntiCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'DKCE';
                for (let i = 0; i < 11; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            }
            let antiCode = generateAntiCode();

            // ============================================================
            // 位置数据
            // ============================================================
            const mockLocations = [
                { name: '芝麻公园', addr: '成都市双流区·芝麻公园' },
                { name: '黄龙溪派出所', addr: '成都市双流区·黄龙溪镇' },
                { name: '天府广场', addr: '成都市青羊区·人民南路' },
                { name: '春熙路', addr: '成都市锦江区·春熙路街道' },
                { name: '宽窄巷子', addr: '成都市青羊区·少城街道' },
                { name: '锦里', addr: '成都市武侯区·武侯祠大街' },
                { name: '人民公园', addr: '成都市青羊区·祠堂街' },
                { name: '环球中心', addr: '成都市高新区·天府大道' },
                { name: '双流国际机场', addr: '成都市双流区·机场路' },
                { name: '太古里', addr: '成都市锦江区·中纱帽街' },
                { name: '九眼桥', addr: '成都市锦江区·九眼桥' },
                { name: '妙中小区', addr: '张家港市·杨舍镇' },
                { name: '张家港站', addr: '张家港市·塘桥镇' },
                { name: '上海外滩', addr: '上海市黄浦区·中山东一路' },
                { name: '北京天安门', addr: '北京市东城区·长安街' },
                { name: '广州塔', addr: '广州市海珠区·阅江西路' },
                { name: '深圳湾', addr: '深圳市南山区·滨海大道' },
            ];

            // ============================================================
            // Toast
            // ============================================================
            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // ============================================================
            // 初始化
            // ============================================================
            function initDateTime() {
                const now = new Date();
                const d = now.toISOString().split('T')[0];
                const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                editDate.value = d;
                editTime.value = t;
            }
            initDateTime();

            // ============================================================
            // 上传
            // ============================================================
            uploadImageBtn.addEventListener('click', function(e) {
                e.preventDefault();
                imageInput.click();
            });

            uploadVideoBtn.addEventListener('click', function(e) {
                e.preventDefault();
                videoInput.click();
            });

            imageInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], false);
                }
                this.value = '';
            });

            videoInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    loadFile(this.files[0], true);
                }
                this.value = '';
            });

            function loadFile(file, video) {
                isVideo = video;
                currentFile = file;
                const url = URL.createObjectURL(file);
                mediaUrl = url;

                placeholder.style.display = 'none';
                mediaContainer.classList.add('active');

                if (video) {
                    previewImage.style.display = 'none';
                    previewVideo.style.display = 'block';
                    previewVideo.src = url;
                    previewVideo.load();
                } else {
                    previewVideo.style.display = 'none';
                    previewImage.style.display = 'block';
                    previewImage.src = url;
                }

                fileInfo.textContent = '📁 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                updateWatermark();
                showToast('✅ 已加载' + (video ? '视频' : '照片'));
            }

            // ================================================================
            // ★★★ 核心：水印渲染 - 像素级还原 ★★★
            // ================================================================
            function updateWatermark() {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '15:12';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '35';
                const location = editLocation.value || '成都市双流区·芝麻公园';
                const title = editTitle.value || '工程记录';
                const showAnti = antiFake.checked;
                const showBrandFlag = showBrand.checked;

                const dateParts = date.split('-');
                const formattedDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];

                if (showAnti) {
                    antiCode = generateAntiCode();
                }

                let html = '';

                // ============================================================
                // 样式1：白底蓝条（与今日水印完全一致）
                // ============================================================
                if (currentStyle === 'white') {
                    html = `
                        <div class="watermark-card">
                            <div class="wm-header">
                                <span class="wm-title">${title}</span>
                                <span class="wm-badge">水印</span>
                            </div>
                            <div class="wm-body">
                                <div class="wm-line">
                                    <span class="wm-label">拍摄时间：</span>
                                    <span class="wm-value">${formattedDate} ${time}</span>
                                </div>
                                <div class="wm-line">
                                    <span class="wm-label">天气：</span>
                                    <span class="wm-value">${weather} <span class="wm-high">高温 ${temp}°C</span></span>
                                </div>
                                <div class="wm-line" style="margin-bottom:0;">
                                    <span class="wm-label">地点：</span>
                                    <span class="wm-location-text">${location} <span class="wm-arrow">▸</span></span>
                                </div>
                            </div>
                            <div class="wm-footer">
                                <div class="wm-brand-group">
                                    <span class="wm-brand-name">今日水印</span>
                                    <span class="wm-brand-sub">相机真实可验</span>
                                </div>
                                ${showAnti ? `<span class="wm-anti">防伪 <span class="hl">${antiCode}</span></span>` : ''}
                                ${!showAnti && showBrandFlag ? `<span class="wm-anti" style="color:#ddd;">今日水印</span>` : ''}
                            </div>
                        </div>
                    `;
                }

                // ============================================================
                // 样式2：黑底透明
                // ============================================================
                else if (currentStyle === 'dark') {
                    html = `
                        <div class="watermark-card-dark">
                            <div class="wm-body">
                                <div class="wm-line" style="font-weight:500;font-size:13px;margin-bottom:2px;">
                                    ${title}
                                </div>
                                <div class="wm-line">
                                    <span class="wm-label">时间：</span>
                                    <span class="wm-value">${formattedDate} ${time}</span>
                                </div>
                                <div class="wm-line">
                                    <span class="wm-label">天气：</span>
                                    <span class="wm-value">${weather} ${temp}°C</span>
                                </div>
                                <div class="wm-line" style="margin-bottom:0;">
                                    <span class="wm-label">地点：</span>
                                    <span class="wm-value">${location}</span>
                                </div>
                            </div>
                            ${showAnti ? `
                            <div class="wm-footer" style="border-top-color:rgba(255,255,255,0.05);">
                                <div class="wm-brand-group">
                                    <span class="wm-brand-name" style="color:rgba(255,255,255,0.5);font-size:11px;">今日水印</span>
                                    <span class="wm-brand-sub" style="color:rgba(255,255,255,0.2);">真实可验</span>
                                </div>
                                <span class="wm-anti" style="color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);">${antiCode}</span>
                            </div>` : ''}
                        </div>
                    `;
                }

                // ============================================================
                // 样式3：简洁白字
                // ============================================================
                else if (currentStyle === 'simple') {
                    html = `
                        <div class="watermark-card-simple">
                            <div class="wm-body">
                                <div style="font-size:20px;font-weight:300;color:#fff;letter-spacing:1px;">${formattedDate}</div>
                                <div style="font-size:26px;font-weight:200;color:#fff;margin:-2px 0 2px 0;">${time}</div>
                                <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:2px;">
                                    <span>${weather} ${temp}°C</span>
                                    <span>${location}</span>
                                </div>
                            </div>
                            ${showAnti ? `
                            <div class="wm-footer" style="border-top-color:rgba(255,255,255,0.05);justify-content:flex-end;padding-top:2px;">
                                <span class="wm-brand-sub" style="color:rgba(255,255,255,0.15);font-size:9px;">今日水印 · 真实可验</span>
                            </div>` : ''}
                        </div>
                    `;
                }

                watermarkOverlay.innerHTML = html;
            }

            // ============================================================
            // 样式切换
            // ============================================================
            document.querySelectorAll('.style-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStyle = this.dataset.style;
                    updateWatermark();
                });
            });

            // ============================================================
            // 编辑事件
            // ============================================================
            editDate.addEventListener('change', updateWatermark);
            editTime.addEventListener('change', updateWatermark);
            editWeather.addEventListener('change', updateWatermark);
            editTemp.addEventListener('change', updateWatermark);
            editTitle.addEventListener('input', updateWatermark);
            antiFake.addEventListener('change', updateWatermark);
            showBrand.addEventListener('change', updateWatermark);

            // ============================================================
            // 位置联想
            // ============================================================
            editLocation.addEventListener('input', function() {
                const value = this.value;
                if (value.length < 2) {
                    suggestions.classList.remove('active');
                    return;
                }

                const results = mockLocations.filter(function(item) {
                    return item.name.includes(value) || item.addr.includes(value);
                });

                if (results.length === 0) {
                    suggestions.innerHTML =
                        `<div class="item" onclick="window.selectLocation('${value}')">📌 使用 "${value}"</div>`;
                } else {
                    suggestions.innerHTML = results.map(function(item) {
                        return `
                            <div class="item" onclick="window.selectLocation('${item.addr}')">
                                📍 ${item.name}
                                <div class="addr">${item.addr}</div>
                            </div>
                        `;
                    }).join('');
                }
                suggestions.classList.add('active');
            });

            editLocation.addEventListener('blur', function() {
                setTimeout(() => suggestions.classList.remove('active'), 300);
            });

            editLocation.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const first = suggestions.querySelector('.item');
                    if (first) first.click();
                    suggestions.classList.remove('active');
                }
            });

            window.selectLocation = function(loc) {
                editLocation.value = loc;
                suggestions.classList.remove('active');
                updateWatermark();
                showToast('📍 位置已更新');
            };

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.edit-area')) {
                    suggestions.classList.remove('active');
                }
            });

            // ================================================================
            // Canvas绘制 - 导出
            // ================================================================
            function drawWatermarkOnCanvas(ctx, w, h) {
                const date = editDate.value || '2026-08-08';
                const time = editTime.value || '15:12';
                const weather = editWeather.value || '晴';
                const temp = editTemp.value || '35';
                const location = editLocation.value || '成都市双流区·芝麻公园';
                const title = editTitle.value || '工程记录';
                const showAnti = antiFake.checked;

                const dateParts = date.split('-');
                const formattedDate = dateParts[0] + '.' + dateParts[1] + '.' + dateParts[2];
                const code = showAnti ? generateAntiCode() : '';

                const scale = Math.min(w, h) / 800;
                const baseFont = Math.max(10, 13 * scale);
                const smallFont = Math.max(8, 10 * scale);
                const padding = Math.max(12, 18 * scale);

                const cardW = w - padding * 2;
                const cardH = 125 * scale;
                const cardX = padding;
                const cardY = h - padding - cardH;

                // ---- 白底卡片 ----
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardW, cardH, 6 * scale);
                ctx.fill();
                ctx.shadowBlur = 0;

                let y = cardY;

                // ---- 蓝条 ----
                const barH = 26 * scale;
                const grad = ctx.createLinearGradient(cardX, y, cardX, y + barH);
                grad.addColorStop(0, '#1a6bc4');
                grad.addColorStop(1, '#2a7ee8');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(cardX, y, cardW, barH, 6 * scale);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = '500 ' + (12 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(title, cardX + 14 * scale, y + barH / 2);

                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = (8 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText('水印', cardX + cardW - 14 * scale, y + barH / 2);

                y += barH;

                // ---- 内容 ----
                const lineH = 20 * scale;
                const labelX = cardX + 14 * scale;
                y += 4 * scale;

                // 拍摄时间：
                ctx.fillStyle = '#555555';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('拍摄时间：', labelX, y + lineH / 2);

                ctx.fillStyle = '#1a1a1a';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText(formattedDate + ' ' + time, labelX + 58 * scale, y + lineH / 2);

                y += lineH;

                // 天气：
                ctx.fillStyle = '#555555';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText('天气：', labelX, y + lineH / 2);

                ctx.fillStyle = '#1a1a1a';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText(weather + ' 高温 ' + temp + '°C', labelX + 58 * scale, y + lineH / 2);

                y += lineH;

                // 地点：
                ctx.fillStyle = '#555555';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText('地点：', labelX, y + lineH / 2);

                ctx.fillStyle = '#1a1a1a';
                ctx.font = (11 * scale) + 'px -apple-system, sans-serif';
                ctx.fillText(location, labelX + 58 * scale, y + lineH / 2);

                y += lineH + 2 * scale;

                // ---- 底部 ----
                const footerY = cardY + cardH - 24 * scale;
                ctx.strokeStyle = '#e8e8e8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cardX + 14 * scale, footerY);
                ctx.lineTo(cardX + cardW - 14 * scale, footerY);
                ctx.stroke();

                ctx.textBaseline = 'middle';

                if (showAnti) {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = '500 ' + (11 * scale) + 'px -apple-system, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('今日水印', cardX + 14 * scale, footerY + 12 * scale);

                    ctx.fillStyle = '#999999';
                    ctx.font = (8 * scale) + 'px -apple-system, sans-serif';
                    ctx.fillText('相机真实可验', cardX + 14 * scale, footerY + 12 * scale + 12 * scale);

                    ctx.fillStyle = '#bbbbbb';
                    ctx.font = (8 * scale) + 'px monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('防伪 ' + code, cardX + cardW - 14 * scale, footerY + 12 * scale);
                } else {
                    ctx.fillStyle = '#dddddd';
                    ctx.font = (9 * scale) + 'px -apple-system, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText('今日水印', cardX + cardW - 14 * scale, footerY + 12 * scale);
                }

                ctx.textBaseline = 'alphabetic';
            }

            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            // ============================================================
            // 导出
            // ============================================================
            exportBtn.addEventListener('click', function() {
                if (!currentFile) {
                    showToast('⚠️ 请先选择照片或视频');
                    return;
                }
                if (isVideo) {
                    exportVideo();
                } else {
                    exportImage();
                }
            });

            function exportImage() {
                const img = previewImage;
                if (!img.src || img.style.display === 'none') {
                    showToast('⚠️ 没有图片可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const imgObj = new Image();
                imgObj.crossOrigin = 'anonymous';
                imgObj.onload = function() {
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    ctx.drawImage(imgObj, 0, 0);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 图片导出成功！');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 1000);
                };
                imgObj.onerror = function() {
                    showToast('❌ 图片加载失败');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '💾 导出带水印的文件';
                    progressBar.classList.remove('active');
                };
                imgObj.src = img.src;
            }

            function exportVideo() {
                const video = previewVideo;
                if (!video.src || video.style.display === 'none') {
                    showToast('⚠️ 没有视频可导出');
                    return;
                }

                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 处理中...';
                progressBar.classList.add('active');

                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;

                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    drawWatermarkOnCanvas(ctx, canvas.width, canvas.height);

                    const link = document.createElement('a');
                    const ts = Date.now();
                    link.download = '水印视频帧_' + ts + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    progressFill.style.width = '100%';
                    showToast('✅ 视频帧导出成功！');
                } catch (e) {
                    showToast('❌ 导出失败: ' + e.message);
                }

                exportBtn.disabled = false;
                exportBtn.textContent = '💾 导出带水印的文件';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 1000);
            }

            // ============================================================
            // 初始渲染
            // ============================================================
            updateWatermark();

            console.log('📷 今日水印相机 - 像素级还原版 v2');
            console.log('💡 文字格式：拍摄时间：xxx  天气：xxx  地点：xxx');

        })();
    </script>
